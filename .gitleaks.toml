# ADR-598 G12 — gitleaks configuration.
#
# Extends gitleaks' built-in ruleset (100+ secret detectors) and adds repo-specific
# allowlisting for KNOWN-SAFE strings only. Two allowlist strategies, chosen per the
# big-player playbook (2026-07-08 full-history triage of 35 findings):
#
#   * paths[]   — generated/vendored files that can NEVER hold a real secret
#                 (font blobs, minified vendor bundles, build artifacts, placeholder
#                 templates, saved 3rd-party pages, junk dumps).
#   * regexes[] — VALUE-scoped allowlist for individual known-safe strings that live
#                 inside otherwise-real source/docs. This is deliberate: it silences
#                 the exact placeholder / public-by-design value WITHOUT blinding the
#                 whole file, so a NEW real secret in the same file is still caught.
#                 It also survives a history rewrite (no commit-SHA binding, unlike a
#                 .gitleaksignore fingerprint).
#
# GENUINE secrets are NOT allowlisted here — they are rotated + purged from history
# (git filter-repo). See docs/security (runbook) for the remediation record.
#
# Used by both layers: pre-commit CHECK 14 (`gitleaks protect --staged`) and the CI
# full-history scan (.github/workflows/gitleaks-scan.yml).

title = "Nestor Pagonis — gitleaks (ADR-598 G12)"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist — known-safe paths + value-scoped false positives"

# Legacy behaviour: match a finding if EITHER its path OR its secret matches below.
regexTarget = "match"

paths = [
  # --- non-production paths (pre-existing) ---
  '''(^|/)__mocks__/''',
  '''(^|/)__tests__/''',
  '''\.(test|spec)\.[jt]sx?$''',
  '''(^|/)src/i18n/locales/''',
  '''(^|/)e2e/''',
  '''(^|/)playwright-report/''',
  '''pnpm-lock\.yaml$''',

  # --- G12 triage 2026-07-08: generated / vendored / junk — never a real secret ---
  '''(^|/)public/pdf\.worker\.min\.mjs$''',                    # vendored pdf.js worker (base64 → aws-token FP)
  '''(^|/)src/services/gantt-export/roboto-font-data\.ts$''',  # embedded Roboto font base64 (→ aws-token FP)
  '''(^|/)\.next-backup-[0-9-]+/''',                           # stale Next.js build artifact dir
  '''(^|/)\.env\.example$''',                                  # placeholder env template
  '''Sharing Debugger - Meta for Developers\.html$''',         # saved 3rd-party Meta page (short-lived FB tokens)
  '''(^|/)local_3\.txt$''',                                    # junk debug dump (Firebase Auth UID, not a credential)

  # --- G12 triage 2026-08-21: ADR-744 i18n shell-slice manifest ---
  # ΜΗΧΑΝΙΚΗ ΕΞΟΔΟΣ, κατάστιχο ακεραιότητας: τα `inputsSha256`, `artifacts.*` και
  # `shellFiles.*` κρατούν 468 συμβολοσειρές ΑΚΡΙΒΩΣ 64 hex — SHA-256 fingerprints,
  # όχι κλειδιά. Ο `generic-api-key` βλέπει hex υψηλής εντροπίας και τις κατήγγειλε:
  # μετρημένο, **37 από τα 42** ευρήματα ολόκληρου του ιστορικού (88%) ήταν ΑΥΤΕΣ.
  #
  # ΓΙΑΤΙ ΕΙΝΑΙ ΑΣΦΑΛΕΣ ΩΣ path[] ΚΑΙ ΟΧΙ ΜΟΝΟ ΩΣ value: το αρχείο ΠΑΡΑΓΕΤΑΙ
  # (ADR-744: «Never hand-edit those files — they are machine output») και η
  # ακεραιότητά του φυλάσσεται ΗΔΗ από το CHECK 3.34, που ξαναχτίζει τον γράφο και
  # συγκρίνει τα ίδια αυτά hashes· ένα χειρόγραφο secret εκεί θα εμφανιζόταν ως
  # drift και θα ΜΠΛΟΚΑΡΕ. Ίδια κατηγορία με τα build artifacts παραπάνω.
  #
  # ⚠️ ΓΙΑΤΙ ΔΕΝ ΕΓΙΝΕ ΤΟ «ΑΥΣΤΗΡΟΤΕΡΟ»: δοκιμάστηκε `[[allowlists]] condition="AND"`
  # (μόνο 64-hex ΚΑΙ μόνο σε αυτό το path) — ΑΠΑΙΤΕΙ gitleaks >= 8.21, και η
  # αναβάθμιση μετρήθηκε ΧΕΙΡΟΤΕΡΗ: οι νέοι κανόνες της 8.30.1 προσθέτουν 5 ψευδώς
  # θετικά ⇒ θόρυβος 20% → 67%. Το «πιο σύγχρονο εργαλείο» δεν είναι αυτομάτως
  # καλύτερη πύλη· ο λόγος σήματος/θορύβου είναι το κριτήριο. Δες το σχόλιο στο
  # .github/workflows/gitleaks-scan.yml.
  '''(^|/)src/i18n/generated/shell-slice\.manifest\.json$''',
]

regexes = [
  # --- G12 triage 2026-07-08: value-scoped structural false positives ---
  # token-charset constant (src/services/sharing/unified-sharing.service.ts)
  '''ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789''',
  # localStorage key, ΟΧΙ διαπιστευτήριο (scripts/lib/golden-triage/sheet-script.js:15).
  # Ο κανόνας πυροδοτεί στο όνομα `KEY`· η τιμή είναι το ονοματοδοτικό κλειδί κάτω
  # από το οποίο η σελίδα διαλογής θυμάται τις αποφάσεις της (ADR-775).
  '''adr775-golden-decisions-v1''',
  # doc/source PLACEHOLDERS (not real keys)
  '''\.\.\.private key data\.\.\.''',                          # DockerOrchestrator.ts (×2 paths)
  '''YOUR_PRIVATE_KEY_HERE''',                                 # ENV_SETUP_INSTRUCTIONS.md
  '''Your_Private_Key_Here''',                                 # .env.example (also path-allowlisted)
  '''MIIEvQIBADANBgkqhkiG9w0BA\.\.\.''',                       # VERCEL_PRODUCTION_SETUP.md (truncated sample key)

  # --- Firebase WEB API keys: public-by-design (shipped in the browser bundle;
  #     access is controlled by Firestore rules, not by key secrecy — Google docs).
  #     Allowlisted by EXACT value so any new/unknown key stays flagged.
  #     Defense-in-depth: still add HTTP-referrer/API restrictions in GCP console. ---
  '''AIzaSyAcqK3o-zPmXodFPr-gG328QJHlcEc6g1k''',               # nestor-app (NEXT_PUBLIC_FIREBASE_API_KEY)
  '''AIzaSyBXeJkJnGtLa7QhTwGb_hBUqBsM-QZcMqg''',               # pagonis-87766 (create-storages.js)
  '''AIzaSyAXnmBhlPvUX89FmbYqvJdh7VLNKVBwx0Y''',               # data scripts / audit report
  '''AIzaSyCcOlFWq8lWQqZjjf9EfebWKZVfV3jzuoc''',               # data scripts
]

# =============================================================================
# ADR-744 — SHA-256 fingerprints of the generated i18n shell-slice manifest.
#
# ΤΟ ΠΡΟΒΛΗΜΑ ΠΟΥ ΛΥΝΕΙ: το shell-slice.manifest.json ΕΙΝΑΙ ένα κατάστιχο
# ακεραιότητας — `inputsSha256`, `artifacts.*`, `shellFiles.*` κρατούν 468
# συμβολοσειρές μήκους ΑΚΡΙΒΩΣ 64 hex. Ο κανόνας `generic-api-key` βλέπει
# hex υψηλής εντροπίας και τις καταγγέλλει ως κλειδιά: μετρημένο 2026-08-21,
# 37 από τα 42 ευρήματα ολόκληρου του ιστορικού (88%) ήταν ΑΥΤΕΣ.
#
# ΓΙΑΤΙ ΕΧΕΙ ΣΗΜΑΣΙΑ: ο πήχης για ΜΠΛΟΚΑΡΟΥΣΑ πύλη είναι <10% ψευδώς θετικά.
# Στο 88% η πύλη σταματά να είναι όργανο και γίνεται θόρυβος — και τα 5
# ΠΡΑΓΜΑΤΙΚΑ ευρήματα κρύβονταν μέσα στα 37. Η εξαίρεση ΔΕΝ χαλαρώνει την
# ασφάλεια· την ΑΠΟΚΑΘΙΣΤΑ, κάνοντας ξανά αναγνώσιμο το κόκκινο.
#
# ⚠️ ΓΙΑΤΙ `condition = "AND"` ΚΑΙ ΟΧΙ path-allowlist: ένα σκέτο paths[] θα
# τύφλωνε ΟΛΟΚΛΗΡΟ το αρχείο, οπότε ένα πραγματικό κλειδί που θα προσγειωνόταν
# εκεί αύριο θα περνούσε αθόρυβα. Με AND σιγούν ΜΟΝΟ οι 64-hex ΜΟΝΟ σε αυτό
# το ένα μονοπάτι. Αποδεδειγμένο με μέτρηση (gitleaks 8.30.1, 2026-08-21):
#   • πραγματικό manifest ΧΩΡΙΣ την εξαίρεση ....... 27 ευρήματα
#   • πραγματικό manifest ΜΕ την εξαίρεση .......... 0
#   • κλειδί `AIzaSy…` στον ΙΔΙΟ φάκελο ............ πιάνεται (δεν τυφλώθηκε)
#   • ΤΟ ΙΔΙΟ 64-hex σε άλλο μονοπάτι .............. πιάνεται (δεν τυφλώθηκε)
# Ο παρονομαστής είναι μέρος της απόδειξης: χωρίς αυτόν, το «0 ευρήματα» θα
# σήμαινε «κανείς δεν κοίταξε» αντί για «κοίταξα και είναι καθαρά».
#
# ⚠️ ΑΠΑΙΤΕΙ gitleaks >= 8.21.0 (εκεί προστέθηκαν τα [[allowlists]] + condition).
# Το workflow είναι καρφωμένο· αν κατέβει κάτω από 8.21 αυτό το μπλοκ αγνοείται
# ΣΙΩΠΗΛΑ και επιστρέφουν τα 37 ψευδώς θετικά.
# =============================================================================
[[allowlists]]
description = "ADR-744 — SHA-256 fingerprints inside the generated i18n shell-slice manifest"
condition = "AND"
regexTarget = "match"
regexes = ['''\b[a-f0-9]{64}\b''']
paths = ['''(^|/)src/i18n/generated/shell-slice\.manifest\.json$''']
