# CHECK 3.94 — Πύλη αναδιάταξης δημόσιων σελίδων (ADR-797 §Φ.Ρ · WCAG 2.2 SC 1.4.10)
#
# «Χωράει κάθε στοιχείο στην οθόνη — ή κάτι κόβεται σιωπηλά στη δεξιά άκρη;»
#
# Μετρημένο 2026-09-25 στα 390 px: η αρχική έκοβε ΠΕΝΤΕ μπλοκ (ως τα 436 px) ενώ
# `scrollWidth` = 390 — ο καθολικός `overflow-x: clip` του globals.css το έκρυβε.
# Κανένα jest δεν μπορεί να το δει (το jsdom δεν έχει διάταξη) → dev server + Chromium.
name: T2 📱 Public Reflow Gate (CHECK 3.94)

on:
  pull_request:
    paths:
      - 'src/components/public-site/**'
      - 'src/components/search/**'
      - 'src/components/shared/landing-hero/**'
      - 'src/components/mandate/**'
      - 'src/components/short-stay-landing/**'
      - 'src/components/objective-value/**'
      - 'src/core/containers/ShellUtilities.tsx'
      - 'src/core/containers/ShellSurface.tsx'
      - 'src/components/header/**'
      - 'src/components/ui/tabs.tsx'
      - 'src/components/ui/sheet.tsx'
      - 'src/app/(light)/**'
      - 'src/app/shell-surface.css'
      - 'src/app/globals.css'
      - 'src/i18n/locales/el/**'
      - 'tailwind.config.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/public-reflow-gate.yml'
      - '.github/actions/setup-firebase-emulators/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'src/lib/firebase.ts'
  push:
    branches: [main]
    paths:
      - 'src/components/public-site/**'
      - 'src/components/search/**'
      - 'src/components/shared/landing-hero/**'
      - 'src/components/mandate/**'
      - 'src/components/short-stay-landing/**'
      - 'src/components/objective-value/**'
      - 'src/core/containers/ShellUtilities.tsx'
      - 'src/core/containers/ShellSurface.tsx'
      - 'src/components/header/**'
      - 'src/components/ui/tabs.tsx'
      - 'src/components/ui/sheet.tsx'
      - 'src/app/(light)/**'
      - 'src/app/shell-surface.css'
      - 'src/app/globals.css'
      - 'src/i18n/locales/el/**'
      - 'tailwind.config.ts'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/public-reflow-gate.yml'
      - '.github/actions/setup-firebase-emulators/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'src/lib/firebase.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-reflow-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reflow:
    name: 📱 CHECK 3.94 — χωράει κάθε στοιχείο στην οθόνη; (4 σελίδες × 6 πλάτη × 2 θέματα)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # 🐳 ADR-775 §11.1 — browser, βιβλιοθήκες συστήματος και γραμματοσειρές έρχονται ΚΑΡΦΩΜΕΝΑ
    # από την επίσημη εικόνα, όχι από το λειτουργικό του runner (το `ubuntu-latest` έγινε 26.04
    # στις 19/11 και έριξε το `playwright install --with-deps`, χωρίς κανένα commit μας).
    # ⚠️ Η ετικέτα = το `playwright-core` του lockfile· το φυλάει το CHECK 3.65 · Η. Αναβάθμιση
    # πακέτου ⇒ ίδια ετικέτα εδώ, στο ΙΔΙΟ commit. `--user 1001` = ο χρήστης του runner
    # (οδηγία Playwright): workspace και tool cache μένουν δικά του.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --user 1001

    # 🔒 HERMETIC (ADR-797, 2026-11-19): οι σελίδες αποδίδονται ανώνυμες πάνω σε Auth + Firestore
    # **emulator** (project `demo-*` = σύμβαση Firebase «κανένας πραγματικός πόρος»), ΟΧΙ σε ψεύτικο
    # project στο διαδίκτυο. Μετρημένο στο run 44526875434: με το ψεύτικο `ci-public-reflow` το
    # `onSnapshot` του `usePublicListings` ξαναδοκίμαζε ως το σφάλμα ⇒ `<main aria-busy>` έμενε `true`
    # ~31 s σε ΚΑΘΕ test (1.752 s από ~2.500 s) και η πύλη δεν τελείωνε ποτέ στα 45′· το `/ergaleia`,
    # που δεν διαβάζει Firestore, έβγαινε σε 0,1 s. Η πύλη κρίνει τη ΔΙΑΤΑΞΗ, όχι δεδομένα: η άδεια
    # βάση είναι το σταθερό, αναπαραγώγιμο σύνολο δεδομένων της.
    # ⚠️ Ο client ΔΕΝ ρωτά δικό του διακόπτη: το `next.config.js` παράγει το
    #    `NEXT_PUBLIC_USE_FIREBASE_EMULATOR` από το `FIREBASE_AUTH_EMULATOR_HOST` (ΜΙΑ πηγή) και το
    #    `src/lib/firebase.ts` συνδέεται στο `localhost:8080/9099` (οι θύρες του `firebase.json`).
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-public-reflow-emulator
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: localhost
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-nestor-reflow
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-nestor-reflow.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '0'
      NEXT_PUBLIC_FIREBASE_APP_ID: '1:0:web:0'
      FIREBASE_PROJECT_ID: demo-nestor-reflow
      GCLOUD_PROJECT: demo-nestor-reflow
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9.14.0
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      # ADR-800 · ADR-875 §12 — cache + Java + firebase-tools στην ΕΚΔΟΣΗ ΤΟΥ DEPLOYER.
      # ΠΟΤΕ inline εγκατάσταση firebase-tools εδώ: το μπλοκάρει το CHECK 3.65 (ci-tools).
      - name: 🧰 Firebase emulator toolchain (μία έκδοση)
        uses: ./.github/actions/setup-firebase-emulators

      # Οι ΠΡΑΓΜΑΤΙΚΟΙ κανόνες (μεταγλωττισμένοι), όχι ανοιχτός emulator: ό,τι διαβάζει ανώνυμα η σελίδα
      # στην παραγωγή, το διαβάζει κι εδώ — και τίποτα παραπάνω. ΠΡΙΝ τον dev server: ένας client που
      # ξεκινά χωρίς emulator ξαναπέφτει στο ίδιο σενάριο επαναλήψεων που μετρήσαμε.
      - name: 🧪 Σήκωσε Auth + Firestore emulator (demo-nestor-reflow)
        run: |
          node scripts/build-firestore-rules.js
          firebase emulators:start --only auth,firestore --project demo-nestor-reflow > /tmp/emulators.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -s -o /dev/null http://127.0.0.1:9099/ && curl -s -o /dev/null http://127.0.0.1:8080/; then
              echo "emulators up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error title=CHECK 3.94 (ADR-797)::οι emulators δεν σηκώθηκαν σε 120s"
          cat /tmp/emulators.log
          exit 1

      - name: 🚀 Start dev server
        run: pnpm run dev > /tmp/dev-server.log 2>&1 &

      - name: ⏳ Wait for the landing page
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" http://localhost:3000/ || echo 000)
            [ "$code" = "200" ] && echo "η αρχική έτοιμη μετά ${i}0s" && exit 0
            sleep 10
          done
          echo "::error::η αρχική δεν απάντησε 200 σε 600s (τελευταίος κώδικας $code)"
          tail -80 /tmp/dev-server.log
          exit 1

      # ⏱️ `PLAYWRIGHT_LIST_PRINT_STEPS=1`: ο reporter `list` τυπώνει τη διάρκεια ΚΑΘΕ ονομασμένου βήματος
      # (goto · κεφαλίδα · aria-busy · μέτρηση) τη στιγμή που τελειώνει — μετρημένο 2026-11-19: τα πράσινα
      # tests κόστιζαν 33–55 s και η αναφορά HTML (γράφεται μόνο στο τέλος) χάνεται όταν το job ακυρώνεται.
      - name: 📱 CHECK 3.94 — η πύλη αναδιάταξης
        env:
          PLAYWRIGHT_WEB_SERVER_URL: http://localhost:3000/
          PLAYWRIGHT_LIST_PRINT_STEPS: '1'
        run: pnpm run test:public-reflow

      - name: 📤 Upload playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: public-reflow-report
          path: |
            playwright-report/
            reports/junit/playwright.xml
          if-no-files-found: warn

      # `always()`, όχι `failure()`: ένα job που ακυρώνεται στο όριο ΔΕΝ είναι «failure» ⇒ το log (χρόνοι
      # μεταγλώττισης και απόκρισης ανά αίτημα του server) χανόταν ακριβώς όταν χρειαζόταν.
      - name: 📤 Upload dev server log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: public-reflow-dev-server-log
          path: |
            /tmp/dev-server.log
            /tmp/emulators.log
          if-no-files-found: warn
