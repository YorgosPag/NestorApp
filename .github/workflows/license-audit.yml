name: T2 ⚖️ License Audit (ADR-598 G13)

# =============================================================================
# ADR-598 G13 — Full-tree license compliance (CLAUDE.md N.5).
#
# Why this exists
# ---------------
# ΜΙΑ μηχανή για hook ΚΑΙ CI: scripts/check-license-policy.js πάνω στο
# .license-policy.json (κατηγορίες Google, επιμέλειες ανά name@version, εξαιρέσεις
# με ΚΑΡΦΩΜΕΝΗ άδεια και ημερομηνίες μετατροπής/λήξης).
#
# 🔴 Διορθώθηκε 2026-09-16: αυτό το job έγραφε «full tree» αλλά έτρεχε license-checker,
# που με node-linker=isolated βλέπει μόνο το root node_modules — 126 από τα 1.071
# πακέτα prod. Τώρα η απογραφή είναι `pnpm licenses list --prod` = ΟΛΟΣ ο γράφος.
#
# Γιατί ΚΑΙ εδώ, αφού τρέχει ήδη ο hook: ο runner είναι ubuntu, δηλαδή η πλατφόρμα
# της παραγωγής (Netcup). Τα πακέτα πλατφόρμας linux (π.χ. @img/sharp-libvips-linux-x64,
# LGPL) εγκαθίστανται και κρίνονται ΜΟΝΟ εδώ — στα Windows του Giorgio δεν υπάρχουν.
#
# Έξοδοι: 0 καθαρό · 1 παράβαση πολιτικής · 2 UNKNOWN (η μέτρηση δεν έγινε).
# =============================================================================

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'patches/**'
      - '.license-policy.json'
      - 'scripts/check-license-policy.js'
      - 'scripts/lib/license-policy/**'
      - 'scripts/lib/spawn-outcome.js'
      - '.github/workflows/license-audit.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'patches/**'
      - '.license-policy.json'
      - 'scripts/check-license-policy.js'
      - 'scripts/lib/license-policy/**'
      - 'scripts/lib/spawn-outcome.js'
      - '.github/workflows/license-audit.yml'
  workflow_dispatch:

concurrency:
  group: license-audit-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  license-audit:
    name: 🔒 License Audit (full tree, N.5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.0
          run_install: false

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # Η απογραφή διαβάζει lockfile + εγκατεστημένο store, και ο έλεγχος απόκλισης
      # συγκρίνει το pnpm-lock.yaml με το node_modules/.pnpm/lock.yaml.
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ⚖️ License policy (full prod graph, Google categories)
        run: node scripts/check-license-policy.js --lockfile=worktree --report

      - name: ✅ Summary
        if: success()
        run: |
          echo "::notice title=License Audit::Every prod package license is allowed, curated or excepted by .license-policy.json"
