name: T2 🌐 i18n Governance (ADR-279)

# =============================================================================
# Layer 2 of Defense in Depth — CI mirror of the pre-commit i18n pipeline.
#
# Why this exists
# ---------------
# The pre-commit hook can be bypassed with `git commit --no-verify`, skipped on
# agents that forget to activate core.hooksPath, or drift out of sync with the
# tracked script. This workflow re-runs the same i18n governance checks against
# every push / PR so that enforcement is guaranteed regardless of how the
# commit was authored.
#
# It is intentionally narrow: ONLY i18n governance checks run here so that it
# stays fast (~30s) and does not get disabled under time pressure the way the
# broader quality-gates.yml / unit.yml workflows have been in the past. Every
# step must be dependency-free pure Node.js — that is what lets this workflow
# skip `pnpm install` entirely. Anything needing a build or a typecheck belongs
# in its own workflow (see ts-error-gate.yml), not here.
#
# Regression that motivated this workflow
# ---------------------------------------
# On 2026-04-11 the /contacts → Δημόσια Υπηρεσία form rendered raw dotted i18n
# keys because `contacts-relationships` was missing from SERVICE_FORM_NAMESPACES
# after ADR-280 namespace splitting. CHECK 3.8 and CHECK 3.12 both passed
# because the keys *existed* in locale files — but the runtime resolver could
# not reach them. CHECK 3.13 closes that gap, and this workflow ensures the
# gap stays closed in CI even when pre-commit is bypassed.
# =============================================================================

on:
  pull_request:
    paths:
      - 'src/i18n/**'
      - 'src/components/generic/i18n/**'
      - 'src/config/**'
      - 'src/app/**/service-config.ts'
      - 'src/app/**/individual-config.ts'
      - 'src/types/i18n.ts'
      - 'src/**'
      - 'scripts/check-i18n-*.js'
      - 'scripts/generate-i18n-keys-baseline.js'
      - 'scripts/lib/i18n-missing-keys-ratchet.js'
      - 'scripts/lib/i18n-namespace-extract.js'
      - 'scripts/generate-i18n-types.js'
      - 'scripts/check-audit-value-catalogs.js'
      - 'scripts/validate-translations.js'
      - 'scripts/_shared/i18n-governance.js'
      - '.i18n-*.json'
      - '.github/workflows/i18n-governance.yml'
  push:
    branches: [main]
    paths:
      - 'src/i18n/**'
      - 'src/components/generic/i18n/**'
      - 'src/config/**'
      - 'src/types/i18n.ts'
      - 'src/**'
      - 'scripts/check-i18n-*.js'
      - 'scripts/generate-i18n-keys-baseline.js'
      - 'scripts/lib/i18n-missing-keys-ratchet.js'
      - 'scripts/lib/i18n-namespace-extract.js'
      - 'scripts/generate-i18n-types.js'
      - 'scripts/check-audit-value-catalogs.js'
      - 'scripts/validate-translations.js'
      - 'scripts/_shared/i18n-governance.js'
      - '.i18n-*.json'

concurrency:
  group: i18n-governance-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  governance:
    name: 🔒 i18n Governance Ratchets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # We do not need a full dependency install — every governance script is
      # pure Node.js (no runtime deps) that walks the repo filesystem. This
      # keeps the workflow under 30s and independent of pnpm-lock churn.

      # ADR-727 — CHECK 3.33. src/types/i18n.ts is generated from the el locale
      # JSONs and went four months stale (+39.920/−16.368 lines) while every
      # pre-commit CHECK stayed green, because none of them asked whether a
      # generated file still matches its inputs.
      #
      # This is the canonical "regenerate and fail on a non-empty diff" gate
      # (`go generate` + `git diff --exit-code`, Bazel diff_test). It became
      # possible only after ADR-727 removed `new Date()` from the generated
      # header — with a clock in the output no such check can ever pass.
      #
      # Layer 2 matters here specifically because Layer 1 is trigger-scoped: the
      # hook only fires CHECK 3.33 when a locale JSON or the generated file is
      # staged. A commit made with --no-verify, or on a machine without
      # core.hooksPath, bypasses it entirely. This step is unconditional.
      - name: 🔍 CHECK 3.33 — i18n generated-types freshness (ADR-727)
        run: node scripts/check-i18n-types-freshness.js

      - name: 🔍 CHECK 3.13 — i18n runtime resolver reachability (full scan)
        run: node scripts/check-i18n-resolver-reachability.js --all

      - name: 🔍 CHECK 3.14 — Audit value catalogs SSoT parity
        run: node scripts/check-audit-value-catalogs.js

      # ADR-666 — EL↔EN completeness. Complementary to CHECK 3.8, not a duplicate:
      # 3.8 walks code→locale (a t('key') with no matching entry); this walks
      # locale→locale (a key present in el but missing from en). Neither sees the
      # other's gap. This became gateable only after ADR-666 deleted the 80
      # committed pseudo JSON files that kept it at EXIT 1 with 693 lines of rot.
      #
      # Scoped deliberately. Do NOT swap this for the `i18n:check` npm script: it
      # still bundles validate:i18n-manifest, which carries 3 pre-existing errors
      # (17 namespaces absent from namespace-manifest.json — governance metadata,
      # tracked separately in .claude-rules/pending-ratchet-work.md). That would
      # red the workflow for reasons unrelated to translation completeness.
      # validate:i18n-config is no longer in that category — see the step below.
      - name: 🔍 validate:i18n — EL↔EN translation completeness (ADR-666)
        run: node scripts/validate-translations.js

      # CHECK 3.36 (ADR-752) — namespace reachability. Layer 1 is the pre-commit
      # hook (staged-triggered); this step is unconditional, so a commit made with
      # --no-verify or on a machine without core.hooksPath cannot land a namespace
      # that has locale files but no loader — the exact shape of the ADR-752 bug,
      # which sat in main with every other CHECK green until a human saw raw keys
      # in a screenshot. The validator itself is older than the gate: it had been
      # red for six namespaces, unread, because nothing ran it.
      - name: 🔍 CHECK 3.36 — i18n namespace reachability (ADR-752)
        run: node scripts/validate-i18n-config.js

      # 🔴 CHECK 3.8 — Layer 2 (ADR-777 §8.41). Αυτό το σχόλιο έλεγε μέχρι τις
      # 2026-08-21 ότι η 3.8 «does not support a repo-wide --all mode ... would
      # be a no-op, so they are intentionally omitted here». Ο ΠΛΗΡΗΣ ΣΑΡΩΤΗΣ
      # ΗΤΑΝ ΗΔΗ ΕΔΩ — απλώς ΕΓΡΑΦΕ τη baseline αντί να την ΚΡΙΝΕΙ. Συνέπεια:
      # παραβίαση σε αρχείο που κανείς δεν σταδιοποιεί δεν φαινόταν ΠΟΤΕ, και η
      # baseline έμεινε μπαγιάτικη 3 μήνες (11/4 έναντι 25/8 πραγματικών).
      # ⚠️ ΜΗΝ το ξαναγυρίσεις σε «μόνο Layer 1»: το Layer 1 βλέπει staged αρχεία,
      # και αυτή ακριβώς η τυφλότητα είναι που άφησε την απόκλιση να ζήσει.
      - name: 🔍 CHECK 3.8 — missing i18n keys (full src/ scan vs baseline)
        run: npm run i18n:keys-check

      # Note: CHECK 3.12 (option-label integrity) is a per-file scanner driven by
      # staged filenames with a legacy baseline that the pre-commit hook enforces
      # ratchet-style; it has no repo-wide mode yet, so it stays Layer 1 only.

      - name: ✅ Summary
        if: success()
        run: |
          echo "::notice title=i18n Governance::All ratchet checks passed"
          echo "CHECK 3.33 (generated-types freshness): PASS"
          echo "CHECK 3.13 (resolver reachability): PASS"
          echo "CHECK 3.14 (audit catalogs parity): PASS"
          echo "validate:i18n (EL/EN completeness): PASS"
          echo "CHECK 3.36 (namespace reachability): PASS"
          echo "CHECK 3.8 (missing i18n keys, full scan): PASS"
