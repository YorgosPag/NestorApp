name: 🚑 CI Health Report

# =============================================================================
# ADR-757 — Ο πίνακας κατάστασης των πυλών CI.
#
# ΤΙ ΑΝΤΙΚΑΤΕΣΤΗΣΕ ΚΑΙ ΓΙΑΤΙ
# ---------------------------
# Η προηγούμενη εκδοχή άκουγε `workflow_run` σε 18 ΧΕΙΡΟΓΡΑΦΑ ονόματα και προσέθετε ένα
# σχόλιο ανά αποτυχία. Δύο δομικά ελαττώματα, μετρημένα:
#
#   (α) Η λίστα είχε αποκλίνει. Επτά πύλες δεν παρακολουθούνταν καθόλου — ανάμεσά τους το
#       «Build & Deploy Docker Image», η ΜΟΝΑΔΙΚΗ πύλη που φράζει την παραγωγή. Στις 05/08
#       το Netcup σταμάτησε να δέχεται και το αρχείο που αυτοπεριγραφόταν ως «durable SSoT
#       of CI failures» δεν το κατέγραψε καν. Ίδιο σχήμα με τις δύο λίστες namespace του
#       CHECK 3.34: δύο χειρόγραφοι κατάλογοι, καμία πύλη να τους συγκρίνει.
#
#   (β) Ήταν append-only. Καμία αποδιπλοποίηση, καμία επίλυση σε πράσινο. Με 8 μόνιμα
#       κόκκινα ⇒ 8 νέα σχόλια σε κάθε push: η ίδια πλημμύρα, μετακομισμένη από το inbox
#       στο Issue. Δεν ήταν συγκέντρωση — ήταν ημερολόγιο.
#
# Η ΑΡΧΗ ΕΔΩ: ΠΡΟΒΟΛΗ, ΟΧΙ ΣΥΣΣΩΡΕΥΣΗ
# ------------------------------------
# Η κατάσταση ΞΑΝΑΫΠΟΛΟΓΙΖΕΤΑΙ από το Actions API για κάθε πύλη του `.ci-gate-tiers.json`.
# Δεν υπάρχει λίστα να ξεχαστεί εδώ μέσα: η πηγή είναι το μητρώο, και το CHECK 3.37
# (`ci-gate-tiers.yml`) φράζει το commit αν κάποιο workflow μείνει εκτός μητρώου.
#
# ΠΟΥ ΠΑΕΙ Η ΕΙΔΟΠΟΙΗΣΗ
# ---------------------
# Η ενημέρωση ΣΩΜΑΤΟΣ issue δεν στέλνει ειδοποίηση· μόνο τα ΣΧΟΛΙΑ στέλνουν. Άρα:
#   - Tier 1/2 σε ΜΕΤΑΒΑΣΗ (έσπασε ή αποκαταστάθηκε) → σχόλιο → ειδοποίηση.
#   - σταθερή κατάσταση, οποιουδήποτε tier                → μόνο σώμα → σιωπή.
#   - Tier 3 (τάσεις)                                     → ποτέ σχόλιο.
#
# ΓΙΑΤΙ ΜΟΝΟ ΤΟ TIER 1 ΕΧΕΙ ΣΚΑΝΔΑΛΗ `workflow_run`
# -------------------------------------------------
# Κάθε `workflow_run` είναι ένα ξεχωριστό τρέξιμο runner. Σκανδάλη σε 26 πύλες × κάθε push
# = δεκάδες τρεξίματα την ημέρα για πληροφορία που το ημερήσιο πέρασμα προβάλλει ούτως ή
# άλλως από το API. Η παραγωγή είναι το μόνο που δεν περιμένει ως αύριο.
#
# ⚠️ ΑΥΤΟ ΤΟ WORKFLOW ΔΕΝ ΕΧΕΙ TIER και δεν παρακολουθεί τον εαυτό του (βρόχος). Αν σπάσει
# ΤΟ ΙΔΙΟ, αποτυγχάνει κανονικά και στέλνει email — σκόπιμα: χαλασμένο όργανο πρέπει να
# ουρλιάζει, αλλιώς η σιωπή του διαβάζεται ως «όλα καλά».
# =============================================================================

on:
  workflow_run:
    workflows:
      # ΜΟΝΟ Tier 1. Επιβάλλεται από το CHECK 3.37 και προς τις δύο κατευθύνσεις:
      # Tier 1 που λείπει = αόρατη αποτυχία παραγωγής· μη-Tier-1 που περισσεύει = σπατάλη.
      - "T1 🚀 Build & Deploy Docker Image"
    types: [completed]
  schedule:
    # 05:00 UTC = 08:00 Αθήνα — ο πίνακας είναι φρέσκος πριν ξεκινήσει η μέρα.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  issues: write
  actions: read
  contents: read

concurrency:
  # ΔΕΝ ακυρώνεται εν εξελίξει: το πέρασμα κάνει read-modify-write στο σώμα του issue.
  group: ci-health-report
  cancel-in-progress: false

jobs:
  report:
    name: 🚑 Προβολή κατάστασης πυλών στο CI Health issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Καμία εγκατάσταση εξαρτήσεων: ο συγκεντρωτής χρησιμοποιεί μόνο built-ins (fetch).
      - name: 🚑 Ενημέρωση πίνακα κατάστασης
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/ci-health-report.js
