            echo ""
            echo "**Το «φοράει κέλυφος;» το απαντά Η ΙΕΡΑΡΧΙΑ ΦΑΚΕΛΩΝ, όχι λίστα διαδρομών.**"
            echo ""
            echo "| κατάσταση | τι σημαίνει | θεραπεία |"
            echo "|---|---|---|"
            echo "| \`ungrouped-page\` | σελίδα εκτός κάθε route group ⇒ κληρονομεί ό,τι τύχει | βάλ' τη σε \`(app)\` / \`(light)\` / \`(auth)\` / \`(bare)\` |"
            echo "| \`public-surface-wearing-shell\` | σελίδα που διαβάζει τη **δημόσια προβολή** ζει σε group με κέλυφος | μετακίνησέ τη σε group \`wearsShell: false\` |"
            echo "| \`shell-mismatch\` | η δομή διαφωνεί με τη δήλωση | λείπει/μετακινήθηκε ο ιδιοκτήτης-layout |"
            echo "| \`undeclared-group\` | νέο route group χωρίς γραμμή στο μητρώο | δήλωσέ το στο \`.shell-boundary.json\` **με λόγο** |"
            echo "| \`shell-outside-owner\` | κάποιος άλλος εισάγει \`AppSidebar\`/\`AppHeader\` | το κέλυφος έχει **έναν** ιδιοκτήτη |"
            echo ""
            echo "⚠️ **ΜΗΝ** το κάνεις ratchet και **ΜΗΝ** προσθέσεις group χωρίς λόγο —"
            echo "ο λόγος **είναι** η απάντηση."
