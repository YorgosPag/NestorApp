name: T2 🧬 SSoT Discover Ratchet (ADR-314)

# =============================================================================
# Layer 2 of Defense in Depth — CI-authoritative SSoT discover gate.
#
# Why this exists
# ---------------
# CHECK 3.7 (.ssot-registry.json ratchet) blocks regressions of *already
# registered* SSoT modules. It cannot detect brand-new duplicate symbols or
# newly-introduced scattered anti-patterns — the pre-existing
# `npm run ssot:discover` scanner does, but ran only manually/offline.
#
# CHECK 3.18 closes that gap by turning the discover scanner into a
# presubmit-grade ratchet. The local pre-commit hook (Layer 1) only runs a
# fast smoke check because the scanner takes ~4 minutes on Windows Git Bash.
# This workflow re-runs the full 4-phase scan against every PR / push to
# main so the gate is guaranteed regardless of local hook coverage.
#
# Regression it prevents
# ----------------------
# Phases C.5.1 → C.5.21 of ADR-314 were retroactive cleanup of duplicates
# born during earlier sessions with no enforcement. Every cycle of cleanup
# costs ~30 minutes/file. A CI-time gate prevents that debt from re-accruing.
# =============================================================================

on:
  pull_request:
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'scripts/ssot-discover.sh'
      - 'scripts/check-ssot-discover-ratchet.js'
      # CHECK 3.48 (ADR-778) — η ίδια η πύλη είναι είσοδος: αλλαγή στο κριτήριο πρέπει να
      # ξανακρίνει ολόκληρο το δέντρο, αλλιώς το job μένει πράσινο πάνω στην αλλαγή του.
      - 'scripts/check-empty-select-item.js'
      # CHECK 3.50 (ADR-780) — μια ωμή `z-index: 9999` προσγειώνεται εξίσου σε `.css`, και
      # τα `.css` ΔΕΝ ήταν σκανδάλη αυτού του workflow. ⚠️ ΔΗΛΩΜΕΝΗ ΣΥΝΕΠΕΙΑ: ένα PR που
      # αγγίζει μόνο `.css` ξυπνά πλέον και τα τέσσερα αδέλφια jobs. Προτιμήθηκε από το
      # εναλλακτικό — να τρέχει το 3.50 μόνο σε PR που αγγίζουν TS — γιατί εκείνο θα ήταν
      # Layer 2 τυφλό ακριβώς στη μισή του επιφάνεια (ADR-780 §4.3: μία επιφάνεια, τρεις
      # διάλεκτοι· το `.css` είναι η μία από τις τρεις).
      - 'src/**/*.css'
      - 'design-tokens.json'
      - 'scripts/check-zindex-scale.js'
      - 'scripts/lib/zindex/**'
      - '.zindex-scale-baseline.json'
      # CHECK 3.52 (ADR-777 §8.12) — το σύνορο κελύφους. Η ίδια η πύλη και οι δηλώσεις της
      # είναι είσοδοι: αλλαγή στο κριτήριο ή στο κλειστό σύνολο των route groups πρέπει να
      # ξανακρίνει ΟΛΟ το δέντρο, αλλιώς το job μένει πράσινο πάνω στην αλλαγή του.
      - 'scripts/check-shell-boundary.js'
      - 'scripts/lib/shell-boundary/**'
      - '.shell-boundary.json'
      # CHECK 3.53 (ADR-739 §0.3 / ADR-777 §0.4) — ταυτότητα ενοτήτων ADR. Τα ίδια τα
      # έγγραφα είναι είσοδοι: η διαγραφή μιας επικεφαλίδας κάνει αδέσποτους δείκτες σε
      # αρχεία που κανείς δεν άγγιξε (996 από τους 1.104 ζουν στο `src/subapps`, που ήδη
      # καλύπτεται παραπάνω). Η πύλη και το κλειστό σύνολο δηλώσεων επίσης.
      - 'docs/centralized-systems/reference/adrs/**/*.md'
      - 'scripts/check-adr-section-refs.js'
      - 'scripts/lib/adr-sections/**'
      - '.adr-section-refs.json'
      - '.adr-section-refs-baseline.json'
      # ADR-780 Φάση Β — το ΣΥΝΟΡΟ ΤΩΝ ΤΡΙΤΩΝ: το μητρώο και τα αρχεία εξαρτήσεων είναι
      # είσοδοι της απογραφής του node_modules. Ένα npm i με z-index: 99999 δεν αγγίζει
      # κανένα αρχείο πηγής — χωρίς αυτά θα περνούσε αθέατο.
      - '.zindex-foreign.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.ssot-discover-baseline.json'
      - '.ssot-registry.json'
      - '.github/workflows/ssot-discover.yml'
  push:
    branches: [main]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'scripts/ssot-discover.sh'
      - 'scripts/check-ssot-discover-ratchet.js'
      # CHECK 3.48 (ADR-778) — η ίδια η πύλη είναι είσοδος: αλλαγή στο κριτήριο πρέπει να
      # ξανακρίνει ολόκληρο το δέντρο, αλλιώς το job μένει πράσινο πάνω στην αλλαγή του.
      - 'scripts/check-empty-select-item.js'
      # CHECK 3.50 (ADR-780) — μια ωμή `z-index: 9999` προσγειώνεται εξίσου σε `.css`, και
      # τα `.css` ΔΕΝ ήταν σκανδάλη αυτού του workflow. ⚠️ ΔΗΛΩΜΕΝΗ ΣΥΝΕΠΕΙΑ: ένα PR που
      # αγγίζει μόνο `.css` ξυπνά πλέον και τα τέσσερα αδέλφια jobs. Προτιμήθηκε από το
      # εναλλακτικό — να τρέχει το 3.50 μόνο σε PR που αγγίζουν TS — γιατί εκείνο θα ήταν
      # Layer 2 τυφλό ακριβώς στη μισή του επιφάνεια (ADR-780 §4.3: μία επιφάνεια, τρεις
      # διάλεκτοι· το `.css` είναι η μία από τις τρεις).
      - 'src/**/*.css'
      - 'design-tokens.json'
      - 'scripts/check-zindex-scale.js'
      - 'scripts/lib/zindex/**'
      - '.zindex-scale-baseline.json'
      # CHECK 3.52 (ADR-777 §8.12) — το σύνορο κελύφους. Η ίδια η πύλη και οι δηλώσεις της
      # είναι είσοδοι: αλλαγή στο κριτήριο ή στο κλειστό σύνολο των route groups πρέπει να
      # ξανακρίνει ΟΛΟ το δέντρο, αλλιώς το job μένει πράσινο πάνω στην αλλαγή του.
      - 'scripts/check-shell-boundary.js'
      - 'scripts/lib/shell-boundary/**'
      - '.shell-boundary.json'
      # CHECK 3.53 (ADR-739 §0.3 / ADR-777 §0.4) — ταυτότητα ενοτήτων ADR. Τα ίδια τα
      # έγγραφα είναι είσοδοι: η διαγραφή μιας επικεφαλίδας κάνει αδέσποτους δείκτες σε
      # αρχεία που κανείς δεν άγγιξε (996 από τους 1.104 ζουν στο `src/subapps`, που ήδη
      # καλύπτεται παραπάνω). Η πύλη και το κλειστό σύνολο δηλώσεων επίσης.
      - 'docs/centralized-systems/reference/adrs/**/*.md'
      - 'scripts/check-adr-section-refs.js'
      - 'scripts/lib/adr-sections/**'
      - '.adr-section-refs.json'
      - '.adr-section-refs-baseline.json'
      # ADR-780 Φάση Β — το ΣΥΝΟΡΟ ΤΩΝ ΤΡΙΤΩΝ: το μητρώο και τα αρχεία εξαρτήσεων είναι
      # είσοδοι της απογραφής του node_modules. Ένα npm i με z-index: 99999 δεν αγγίζει
      # κανένα αρχείο πηγής — χωρίς αυτά θα περνούσε αθέατο.
      - '.zindex-foreign.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.ssot-discover-baseline.json'
      - '.ssot-registry.json'

concurrency:
  group: ssot-discover-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    name: 🔒 SSoT Discover Ratchet (CHECK 3.18)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependency install required — scanner is pure bash + Node stdlib.
      # Keeps the workflow under 2 minutes wall-clock on Linux runners.

      - name: 🔍 CHECK 3.18 — SSoT discover ratchet (full 4-phase scan)
        run: node scripts/check-ssot-discover-ratchet.js --full

      - name: ✅ Summary
        if: success()
        run: |
          echo "::notice title=SSoT Discover Ratchet::No new duplicates / anti-patterns / registry gaps"

  # ===========================================================================
  # CHECK 3.44 / ADR-772 §9 — Στρώμα 2 της πύλης λεξιλογίου διευθύνσεων.
  #
  # ΓΙΑΤΙ ΕΔΩ ΚΑΙ ΟΧΙ ΣΕ ΝΕΟ WORKFLOW: ένα νέο αρχείο `.github/workflows/*.yml`
  # ΑΠΑΙΤΕΙ εγγραφή στο `.ci-gate-tiers.json` (tier + why + πρόθεμα `T<tier>` στο
  # `name:`), αλλιώς η CHECK 3.37 γίνεται κόκκινη (ADR-757). Το μητρώο παρακολουθεί
  # **αρχεία** workflow, όχι jobs — άρα ένα job εδώ αφήνει τις 29 πύλες αμετάβλητες.
  # Ίδια κίνηση με το ADR-770 Στρώμα 2/2β μέσα στο `ui-contrast-ratchet.yml`.
  # Η οικογένεια ταιριάζει: το 3.18 ρωτά «υπάρχει διπλότυπο SSoT;», το 3.44 ρωτά
  # «μιλά κάποιος το λεξιλόγιο διευθύνσεων χωρίς να είναι στο SSoT;» — και οι
  # σκανδάλες `src/**/*.ts(x)` είναι ήδη οι σωστές.
  #
  # ΓΙΑΤΙ ΞΕΧΩΡΙΣΤΟ JOB: η σάρωση χρειάζεται τον TypeScript parser (node_modules),
  # ενώ το job παραπάνω δηλώνει ρητά ότι δεν εγκαθιστά τίποτα.
  # ===========================================================================
  address-vocabulary:
    name: 🏛️ Address Vocabulary Coverage (CHECK 3.44)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.0
          run_install: false

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # typescript + jest μόνο. Η πύλη κάνει `ts.createSourceFile`, ποτέ Program —
      # ΔΕΝ είναι type-check (CLAUDE.md N.17).
      - name: 📦 Install dependencies (TypeScript parser + jest)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Το Στρώμα 1 (pre-commit) βλέπει ΜΟΝΟ τα δοχεία του πίνακα. Ένας νέος τύπος
      # οπουδήποτε αλλού στο `src/` που έγινε έκτο λεξιλόγιο είναι αόρατος εκεί —
      # δηλωμένο όριο, και ο λόγος ύπαρξης αυτού του βήματος (~30s, 20k δηλώσεις).
      - name: 🏛️ CHECK 3.44 — πλήρης σάρωση src/ (Στρώμα 2)
        run: pnpm run address-vocabulary:check

      - name: 🧪 Σουίτα μετάλλαξης — CHECK 3.44 (31 tests, 12/12 μεταλλάξεις)
        run: pnpm run test:address-vocabulary

      - name: ✅ Summary
        if: success()
        run: |
          echo "::notice title=Address Vocabulary Coverage::Κανένα αδήλωτο διοικητικό πεδίο· καμία νέα αδήλωτη στήλη λεξιλογίου"

      - name: 🧭 How to resolve
        if: failure()
        run: |
          {
            echo "### CHECK 3.44 — ADR-772 §9 (address vocabulary)"
            echo ""
            echo "**unmapped-administrative-field** (μηδενική ανοχή) — ένα δοχείο απέκτησε"
            echo "πεδίο διοικητικής ιεραρχίας που καμία γραμμή του πίνακα δεν διεκδικεί."
            echo "Πρόσθεσε γραμμή στο \`ADMIN_LEVEL_VOCABULARY\`, ή δήλωσε ρητά \`NOT_STORED\`."
            echo "⚠️ Αν πρόκειται για \`communityId\` σε \`ProjectAddress\`: **μην** το"
            echo "χαρτογραφήσεις — είναι η ανοιχτή σύγκρουση τομέα του ADR-772 §5."
            echo ""
            echo "**unregistered-vocabulary** (ratchet) — νέος τύπος μιλά την ιεραρχία χωρίς"
            echo "να είναι στήλη του \`VocabularyContainers\`."
            echo ""
            echo "Αναφορά: \`npm run address-vocabulary:report\`"
            echo "Reseed ΜΟΝΟ μετά από νόμιμο καθάρισμα: \`npm run address-vocabulary:baseline\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # CHECK 3.48 / ADR-778 — Στρώμα 2 της πύλης του κενού `SelectItem`.
  #
  # ΓΙΑΤΙ ΕΔΩ ΚΑΙ ΟΧΙ ΣΕ ΝΕΟ WORKFLOW: ίδιος λόγος με το 3.44 από πάνω — το
  # μητρώο του `.ci-gate-tiers.json` παρακολουθεί **αρχεία** workflow, όχι jobs,
  # οπότε ένα job εδώ αφήνει τις 31 πύλες αμετάβλητες (ADR-757 / CHECK 3.37).
  # Η οικογένεια ταιριάζει: η θεραπεία είναι το SSoT σεντινέλι
  # `SELECT_CLEAR_VALUE` (`config/domain-constants.ts`) και το κεντρικό
  # `<ClearableSelect>` — δηλαδή «χρησιμοποιείς το SSoT ή το ξαναγράφεις;».
  # ⚠️ ΔΕΝ μπήκε στο `ui-contrast-ratchet.yml`: εκείνο είναι workflow **χρώματος**,
  # και μια αποτυχία Select εκεί θα αναφερόταν ως αποτυχία αντίθεσης (το ίδιο
  # λάθος που απέφυγε ρητά το ADR-775 §Λ2).
  #
  # ΓΙΑΤΙ ΥΠΑΡΧΕΙ ΚΑΘΟΛΟΥ ΔΕΥΤΕΡΟ ΣΤΡΩΜΑ — δηλωμένα:
  # Το κριτήριο είναι **τοπικό** σε ένα JSX στοιχείο ενός αρχείου· δεν υπάρχει
  # καθολική είσοδος που να μπορεί να κάνει παράβαση ένα αρχείο που κανείς δεν
  # σταδιοποίησε (σε αντίθεση με το 3.43, όπου ο δείκτης ορισμών είναι καθολικός).
  # Άρα το Στρώμα 1 είναι **πλήρες** για ό,τι περνά από hook. Αυτό εδώ κλείνει
  # ακριβώς ό,τι **δεν** πέρασε: επεξεργασία από το web UI του GitHub, commit από
  # μηχάνημα χωρίς hooks, ή `SKIP_EMPTY_SELECT_ITEM=1`.
  # ===========================================================================
  empty-select-item:
    name: 🎛️ Empty SelectItem Gate (CHECK 3.48)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ⚠️ fetch-depth: 0 — ΟΧΙ προεπιλογή, και ΜΟΝΟ σε αυτό το job (τα άλλα δύο
      # δεν διαβάζουν ιστορικό). Η ομάδα Π τραβά με `git show 8318b50d:<αρχείο>`
      # τις ΠΡΑΓΜΑΤΙΚΕΣ νάρκες του ADR-739 §59/§60 και απαιτεί μπλοκ στις γραμμές
      # 179/193. Με ρηχό checkout το αντικείμενο δεν υπάρχει (`fatal: invalid
      # object name`) και η βαθμονόμηση σκάει — η πύλη γίνεται μονίμως κόκκινη για
      # λόγο άσχετο με τα `SelectItem`, δηλαδή σταματά να λέει οτιδήποτε.
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.0
          run_install: false

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # `@typescript-eslint/parser` μόνο — ο ίδιος σκελετός AST με το CHECK 3.23.
      # ΔΕΝ είναι type-check (CLAUDE.md N.17): ούτε `tsc`, ούτε Program.
      - name: 📦 Install dependencies (JSX parser + jest)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🎛️ CHECK 3.48 — πλήρης σάρωση src/ (~23s, 614 στοιχεία)
        run: pnpm run empty-select-item:check

      - name: 🧪 Σουίτα μετάλλαξης — CHECK 3.48 (17 tests, απόδειξη σε πραγματικό ιστορικό)
        run: pnpm run test:empty-select-item

      - name: ✅ Summary
        if: success()
        run: |
          echo "::notice title=Empty SelectItem Gate::Κανένα <SelectItem value=\"\"> — καμία επιφάνεια δεν πέφτει σε χρόνο εκτέλεσης"

      - name: 🧭 How to resolve
        if: failure()
        run: |
          {
            echo "### CHECK 3.48 — ADR-778 (empty SelectItem)"
            echo ""
            echo "Το Radix Select **δεσμεύει** το \`''\` ως «καμία επιλογή»: ένα"
            echo "\`<SelectItem value=\"\">\` πετά σε χρόνο εκτέλεσης και **ρίχνει ολόκληρη**"
            echo "την επιφάνεια που το φιλοξενεί. Χτύπησε τρεις φορές (ADR-739 §59.6.3 / §60.7.3)."
            echo ""
            echo "**Λύση (SSoT):**"
            echo "\`\`\`tsx"
            echo "import { SELECT_CLEAR_VALUE, isSelectClearValue } from '@/config/domain-constants';"
            echo "<SelectItem value={SELECT_CLEAR_VALUE}>Καμία επιλογή</SelectItem>"
            echo "// onValueChange: if (isSelectClearValue(v)) setDraft(undefined)"
            echo "\`\`\`"
            echo ""
            echo "Ή χρησιμοποίησε το \`<ClearableSelect>\` (\`@/components/ui/clearable-select\`),"
            echo "που κάνει το \`''\` **δομικά αδύνατο** ως τιμή item."
            echo ""
            echo "Απογραφή: \`npm run empty-select-item:report\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # CHECK 3.49 / ADR-779 — Στρώμα 2 της πύλης ταυτότητας ADR.
  #
  # ΓΙΑΤΙ ΕΔΩ ΚΑΙ ΟΧΙ ΣΕ ΝΕΟ WORKFLOW: ίδιος λόγος με το 3.44 και το 3.48 από
  # πάνω — το μητρώο του `.ci-gate-tiers.json` παρακολουθεί **αρχεία** workflow,
  # όχι jobs, οπότε ένα job εδώ αφήνει τις 31 πύλες αμετάβλητες (CHECK 3.37).
  # Η οικογένεια ταιριάζει κατά γράμμα: το ερώτημα «απαντά αυτό το αναγνωριστικό
  # σε ΕΝΑ πράγμα;» είναι η ίδια ερώτηση SSoT που κάνει όλο το workflow.
  #
  # ΓΙΑΤΙ ΥΠΑΡΧΕΙ ΔΕΥΤΕΡΟ ΣΤΡΩΜΑ — δηλωμένα: η σκανδάλη του Στρώματος 1 είναι
  # «staged αρχείο με όνομα ADR-*». Αυτό είναι **πλήρες** για ό,τι περνά από
  # hook (σύγκρουση γεννιέται μόνο με προσθήκη/μετονομασία εγγράφου ADR), αλλά
  # δεν βλέπει: επεξεργασία από το web UI του GitHub, commit από μηχάνημα χωρίς
  # hooks, ή `SKIP_ADR_IDENTITY=1`. Άρα εδώ τρέχει **άνευ όρων**.
  # ===========================================================================
  adr-identity:
    name: 🔢 ADR Identity Gate (CHECK 3.49)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        # Το `fetch-depth: 0` ΔΕΝ χρειάζεται: η πύλη ρωτά το **index** (`git ls-files`),
        # δηλαδή το δέντρο του commit — ποτέ ιστορικό.
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.0
          run_install: false

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Install dependencies (jest για τη σουίτα μετάλλαξης)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🔢 CHECK 3.49 — ratchet ταυτότητας ADR (~0,5s)
        run: pnpm run adr-identity:check

      - name: 🧪 Σουίτα μετάλλαξης — CHECK 3.49 (19 tests, μίνι-repo με πραγματικό git)
        run: pnpm run test:adr-identity

      - name: ✅ Summary
        if: success()
        run: |
          echo "::notice title=ADR Identity Gate::Καμία ΝΕΑ σύγκρουση αριθμού ADR και κανένα νέο σπίτι ADR"

      - name: 🧭 How to resolve
        if: failure()
        run: |
          {
            echo "### CHECK 3.49 — ADR-779 (ταυτότητα ADR)"
            echo ""
            echo "Ένας αριθμός ADR **έπαψε να προσδιορίζει ένα έγγραφο**."
            echo ""
            echo "**Δύο καταστάσεις, ΔΥΟ διαφορετικές θεραπείες:**"
            echo ""
            echo "- \`collided-same-home\` — δύο συντάκτες πήραν τον ίδιο αριθμό."
            echo "  Θεραπεία: **bumping** — ο ΝΕΟΤΕΡΟΣ (αυτός με τις λιγότερες αναφορές)"
            echo "  παίρνει τον επόμενο ελεύθερο. Ποτέ μετονομασία εγγράφου που ήδη"
            echo "  αναφέρεται: η πρακτική είναι ρητή — *«keep the numbering stable, never renumber»*."
            echo "- \`collided-cross-home\` — ο χώρος αριθμών **διχάστηκε** σε δύο φακέλους."
            echo "  Θεραπεία: **ΕΝΑ σπίτι**. Μετονομασία δεν λύνει τίποτα εδώ."
            echo ""
            echo "**Νέο ΣΠΙΤΙ ADR** μπλοκάρει ακόμα κι αν σήμερα δεν συγκρούεται τίποτα:"
            echo "από τη στιγμή που τα έγγραφα ζουν σε δεύτερο φάκελο, δύο συντάκτες"
            echo "μπορούν να πάρουν τον ίδιο αριθμό **χωρίς κανείς να κάνει λάθος**."
            echo ""
            echo "Απογραφή: \`npm run adr-identity:report\`"
            echo "Reseed ΜΟΝΟ μετά από νόμιμο καθάρισμα: \`npm run adr-identity:baseline\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # CHECK 3.50 / ADR-780 — Στρώμα 2 της πύλης της κλίμακας z-index.
  #
  # ΓΙΑΤΙ ΕΔΩ ΚΑΙ ΟΧΙ ΣΕ ΝΕΟ WORKFLOW: ίδιος λόγος με τα 3.44 / 3.48 / 3.49 από
  # πάνω — το μητρώο του `.ci-gate-tiers.json` παρακολουθεί **αρχεία** workflow,
  # όχι jobs, οπότε ένα job εδώ αφήνει τις 31 πύλες αμετάβλητες (CHECK 3.37).
  # Η οικογένεια ταιριάζει κατά γράμμα: το ερώτημα «ζητά κάθε επιφάνεια τη ΜΙΑ
  # κλίμακα;» **είναι** η ερώτηση SSoT που κάνει όλο το workflow. Βρέθηκαν ΠΕΝΤΕ
  # λεξιλόγια στρώσης, δύο από τα οποία δίνουν διαφορετικό αριθμό στο ΙΔΙΟ όνομα
  # ρόλου — δηλαδή διπλότυπο SSoT με ονόματα, που είναι ακριβώς το 3.18 σε άλλο
  # πεδίο. ⚠️ ΔΕΝ μπήκε στο `ui-contrast-ratchet.yml`: εκείνο είναι workflow
  # **χρώματος** και μια αποτυχία στρώσης εκεί θα αναφερόταν ως αποτυχία
  # αντίθεσης (το λάθος που απέφυγε ρητά το ADR-775 §Λ2).
  #
  # ΓΙΑΤΙ ΥΠΑΡΧΕΙ ΔΕΥΤΕΡΟ ΣΤΡΩΜΑ — δηλωμένα, και ΔΕΝ είναι μόνο «hooks που δεν
  # έτρεξαν»: η σκανδάλη του Στρώματος 1 είναι προφίλτρο **κειμένου** πάνω στα
  # σταδιοποιημένα αρχεία. Ένας νέος ρόλος στο `design-tokens.json` ή μια
  # διαγραφή ορισμού στο `variables.css` ξανακρίνει αρχεία που **κανείς δεν
  # σταδιοποίησε** — και τα δύο ΕΙΝΑΙ στη σκανδάλη, αλλά το `--all` εδώ είναι η
  # μόνη εγγύηση όταν η αλλαγή έρθει από το web UI του GitHub, από μηχάνημα
  # χωρίς hooks, ή με `SKIP_ZINDEX_SCALE=1`. Τρέχει **άνευ όρων** (~5s).
  # ===========================================================================
  zindex-scale:
    name: 🧱 z-index Scale Gate (CHECK 3.50)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.0
          run_install: false

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # jest μόνο, για τη σουίτα μετάλλαξης. Η ίδια η πύλη είναι Node stdlib:
      # διαβάζει JSON + κείμενο, ΔΕΝ κάνει parse TypeScript και ΔΕΝ είναι
      # type-check (CLAUDE.md N.17).
      - name: 📦 Install dependencies (jest για τη σουίτα μετάλλαξης)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🧱 CHECK 3.50 — πλήρης σάρωση (3 διάλεκτοι, ~5s)
        run: pnpm run zindex-scale:check   # + απογραφή node_modules (σύνορο τρίτων, ~6s)

      # ⚠️ ΣΕ ΕΙΣΑΓΩΓΙΚΑ ΜΕ ΛΟΓΟ: το `tests: ` (άνω τελεία + κενό) μέσα σε unquoted YAML
      # scalar διαβάζεται ως ΕΜΦΩΛΕΥΜΕΝΟ mapping — «Nested mappings are not allowed in
      # compact mappings». Το αρχείο γινόταν ΑΠΑΡΣΑΡΙΣΤΟ, δηλαδή το workflow δεν θα έτρεχε
      # ΚΑΘΟΛΟΥ στο GitHub και οι τρεις πύλες του (3.18 · 3.48 · 3.49 · 3.50) θα ήταν
      # σιωπηλά νεκρές — «0 = κανείς δεν κοίταξε», στη χειρότερη μορφή του: πύλη που
      # ΝΟΜΙΖΕΙΣ ότι τρέχει. Το βρήκε το knip, που φορτώνει τα workflows ως εισόδους.
      - name: "🧪 Σουίτα μετάλλαξης — CHECK 3.50 (61 tests: 14 μεταλλάξεις κλίμακας + 17 συνόρου)"
        run: pnpm run test:zindex-scale

      - name: ✅ Summary
        if: success()
        run: |
          echo "::notice title=z-index Scale Gate::Καμία ΝΕΑ ωμή στρώση, κανένα αδέσποτο token, κανένα δεύτερο λεξιλόγιο"

      - name: 🧭 How to resolve
        if: failure()
        run: |
          {
            echo "### CHECK 3.50 — ADR-780 (κλίμακα z-index)"
            echo ""
            echo "**Θεραπεία: ΡΟΛΟΣ, όχι μικρότερος αριθμός.**"
            echo "\`\`\`css"
            echo "z-index: var(--z-index-viewer-menu);   /* όχι 9999 */"
            echo "\`\`\`"
            echo ""
            echo "**ΤΡΕΙΣ καταστάσεις, ΤΡΕΙΣ διαφορετικές θεραπείες:**"
            echo ""
            echo "- \`raw-literal\` (ratchet) — ωμός αριθμός ≥1000. Ζήτησέ τον από την κλίμακα."
            echo "  Αν δεν υπάρχει ρόλος γι' αυτό που κάνεις, **πρόσθεσε ρόλο** στο"
            echo "  \`design-tokens.json ▸ zIndex\` και τρέξε \`npm run build:tokens\`."
            echo "- \`unknown-token\` (**μηδενική ανοχή**) — το \`var(--x)\` δείχνει σε όνομα που"
            echo "  **δεν ορίζεται πουθενά** ⇒ *invalid at computed-value time* ⇒ \`z-index: auto\`."
            echo "  Δεν είναι λάθος τιμή· είναι **καμία** τιμή. Δεν μπαίνει ΠΟΤΕ σε baseline."
            echo "- \`parallel-scale\` (**μηδενική ανοχή**) — δεύτερο λεξιλόγιο στρώσης δίπλα"
            echo "  στη μία κλίμακα. Αυτό ήταν η **ρίζα**: \`--cp-z-tooltip: 10000\` έναντι"
            echo "  \`--z-index-tooltip: 1800\` — δύο ονόματα, ένας ρόλος, δύο αριθμοί."
            echo ""
            echo "⚠️ **Ο αριθμός της baseline ΔΕΝ είναι δείκτης υγείας**: μετρά «όσα σημεία δεν"
            echo "ζητούν ακόμη από την κλίμακα». Ένα bump 9999→9998 θα τον μείωνε και δεν θα"
            echo "διόρθωνε τίποτα."
            echo ""
            echo "Απογραφή: \`npm run zindex-scale:report\`"
            echo "Reseed ΜΟΝΟ μετά από νόμιμο καθάρισμα: \`npm run zindex-scale:baseline\`"
          } >> "$GITHUB_STEP_SUMMARY"

  shell-boundary:
    name: 🧱 Shell Boundary Gate (CHECK 3.52)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        # ⚠️ ΠΛΗΡΕΣ ιστορικό: ο κανόνας Κ2 ρωτά το git (`git grep --untracked`) για την
        # αντίστροφη κλειστότητα των δημόσιων hooks. Ρηχό checkout αρκεί για grep, αλλά το
        # `fetch-depth: 0` κρατά τη συμπεριφορά ταυτόσημη με το pre-commit.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.0
          run_install: false

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Install dependencies (jest + typescript για το AST της κλειστότητας)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Layer 2 — ΑΝΕΥ ΟΡΩΝ και ΠΛΗΡΕΣ. Το Layer 1 πυροδοτεί μόνο σε staged page/layout·
      # ένα νέο route group ή μια αλλαγή στις δηλώσεις ξανακρίνει αρχεία που κανείς δεν
      # σταδιοποίησε.
      - name: 🧱 CHECK 3.52 — πλήρες σύνορο κελύφους (Κ1 + Κ2 + Κ3)
        run: pnpm run shell-boundary:check

      - name: "🧪 Σουίτα μετάλλαξης — CHECK 3.52 (21 tests: 8 μεταλλάξεις εισόδων + 6 άγκυρες κριτηρίου + 4 στο πραγματικό δέντρο)"
        run: pnpm run test:shell-boundary

      - name: 🧭 How to resolve
        if: failure()
        run: |
          {
            echo "### CHECK 3.52 — ADR-777 §8.12 (σύνορο κελύφους)"
            echo ""
            echo "**Το «φοράει κέλυφος;» το απαντά Η ΙΕΡΑΡΧΙΑ ΦΑΚΕΛΩΝ, όχι λίστα διαδρομών.**"
            echo ""
            echo "| κατάσταση | τι σημαίνει | θεραπεία |"
            echo "|---|---|---|"
            echo "| \`ungrouped-page\` | σελίδα εκτός κάθε route group ⇒ κληρονομεί ό,τι τύχει | βάλ' τη σε \`(app)\` / \`(light)\` / \`(auth)\` / \`(bare)\` |"
            echo "| \`public-surface-wearing-shell\` | σελίδα που διαβάζει τη **δημόσια προβολή** ζει σε group με κέλυφος | μετακίνησέ τη σε group \`wearsShell: false\` |"
            echo "| \`shell-mismatch\` | η δομή διαφωνεί με τη δήλωση | λείπει/μετακινήθηκε ο ιδιοκτήτης-layout |"
            echo "| \`undeclared-group\` | νέο route group χωρίς γραμμή στο μητρώο | δήλωσέ το στο \`.shell-boundary.json\` **με λόγο** |"
            echo "| \`shell-outside-owner\` | κάποιος άλλος εισάγει \`AppSidebar\`/\`AppHeader\` | το κέλυφος έχει **έναν** ιδιοκτήτη |"
            echo ""
            echo "⚠️ **ΜΗΝ** το κάνεις ratchet και **ΜΗΝ** προσθέσεις group χωρίς λόγο —"
            echo "ο λόγος **είναι** η απάντηση."
            echo ""
            echo "Απογραφή: \`npm run shell-boundary:report\`"
          } >> "$GITHUB_STEP_SUMMARY"

  adr-section-refs:
    name: 🔗 ADR Section Identity Gate (CHECK 3.53)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        # ⚠️ ΠΛΗΡΕΣ ιστορικό: η πύλη διαβάζει το **index του git** (`git ls-files`), όχι τον
        # δίσκο — ο δίσκος βλέπει untracked προσχέδια ⇒ άλλο αποτέλεσμα ανά εκτέλεση.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.0
          run_install: false

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Install dependencies (jest για τη σουίτα μετάλλαξης)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Layer 2 — ΑΝΕΥ ΟΡΩΝ και ΠΛΗΡΕΣ. Το Layer 1 πυροδοτεί μόνο σε staged ADR/SPEC· η
      # διαγραφή μιας επικεφαλίδας κάνει αδέσποτους δείκτες σε **αρχεία που κανείς δεν
      # σταδιοποίησε** (996 από τους 1.104 ζουν στο `src/subapps`).
      - name: 🔗 CHECK 3.53 — ταυτότητα ενοτήτων ADR (~2s)
        run: pnpm run adr-section-refs:check

      - name: "🧪 Σουίτα μετάλλαξης — CHECK 3.53"
        run: pnpm run test:adr-section-refs

      - name: 🧭 How to resolve
        if: failure()
        run: |
          {
            echo "### CHECK 3.53 — ταυτότητα ενοτήτων ADR (ADR-739 §0.3 / ADR-777 §0.4)"
            echo ""
            echo "**Ο αριθμός ενότητας είναι ΣΥΜΒΟΛΑΙΟ — δεν επαναριθμείται ποτέ.**"
            echo "Δείχνουν σε αυτόν ~2.500 δείκτες, 996 μόνο στο \`src/subapps\`."
            echo ""
            echo "| κατάσταση | τι σημαίνει | θεραπεία |"
            echo "|---|---|---|"
            echo "| \`dangling-section\` | ο δείκτης δεν υπάρχει **πουθενά** στην οικογένεια | διόρθωσε τον **δείκτη** — μην τον σβήσεις |"
            echo "| \`ambiguous-section\` | δύο επικεφαλίδες με το ίδιο ID ⇒ ο δείκτης δεν προσδιορίζει θέση | δώσε στη **δεύτερη** δικό της, μοναδικό ID |"
            echo "| \`prose-only\` | υπάρχει ως κείμενο, όχι ως επικεφαλίδα ⇒ καμία άγκυρα | κάνε την πραγματική επικεφαλίδα |"
            echo "| \`orphan-section\` | ⛔ ενότητα εκτός \`sections:\` του αρχείου της | δήλωσέ την στο frontmatter |"
            echo "| \`broken-bond\` | ⛔ λείπει \`parent:\` ή ο αντίστροφος δεσμός | συμβόλαιο ADR-777 §0.4 |"
            echo ""
            echo "⚠️ **ΜΗΝ** λύσεις κόκκινο σβήνοντας τον δείκτη χωρίς να δεις τι εννοούσε —"
            echo "ο δείκτης είναι **η ερώτηση**, όχι ο θόρυβος."
            echo ""
            echo "Απογραφή: \`npm run adr-section-refs:report\`"
            echo "Reseed ΜΟΝΟ μετά από νόμιμο καθάρισμα: \`npm run adr-section-refs:baseline\`"
          } >> "$GITHUB_STEP_SUMMARY"
