      # αρχείο του src/, και μια σβησμένη εξαγωγή ΜΕΣΑ στο subapp κάνει ορφανή μια
      # δήλωση σε αρχείο που κανείς δεν έστειλε — μερική ανάλυση θα ήταν αναληθής.
      - name: 🚪 CHECK 3.62 — κάθε δημόσιο σύμβολο δηλωμένο, με λόγο
        run: pnpm run public-surface:check

      - name: "🧪 Σουίτα μετάλλαξης — CHECK 3.62"
        run: pnpm run test:public-surface

      - name: 🧭 How to resolve
        if: failure()
        run: |
          {
            echo "### CHECK 3.62 — ADR-796 (δημόσια επιφάνεια του dxf-viewer)"
            echo ""
            echo "Κάθε σύμβολο που ζητά ο **έξω** κόσμος πρέπει να είναι δηλωμένο δημόσιο."
            echo ""
            echo "- **αδήλωτη εισαγωγή** ⇒ δήλωσέ την στο \`.dxf-viewer-public-api.json\` ΜΕ ΛΟΓΟ,"
            echo "  ή σταμάτα να ζητάς το σύμβολο από έξω."
            echo "- **ορφανή δήλωση** ⇒ σβήσε τη γραμμή: η επιφάνεια ΣΥΡΡΙΚΝΩΘΗΚΕ, καλό είναι."
            echo "- **δήλωση χωρίς λόγο** ⇒ γράψε το «γιατί»· χωρίς αυτό κανείς δεν μπορεί να κλαδέψει."
            echo ""
            echo "⛔ ΜΗΝ φτιάξεις barrel για να περάσει. Το Atlassian ΑΦΑΙΡΕΣΕ τα barrels από"
            echo "το Jira (90.000 αρχεία) και μέτρησε **75% ταχύτερα builds**. Η ενθυλάκωση εδώ"
            echo "ζει ως **ΔΕΔΟΜΕΝΟ** (μανιφέστο), όχι ως module, και γι αυτό δεν κοστίζει τίποτα."
            echo ""
            echo "Απογραφή: \`npm run public-surface:report\`"
            echo "Reseed ΜΟΝΟ μετά από νόμιμη συρρίκνωση: \`npm run public-surface:baseline\`"
          } >> "$GITHUB_STEP_SUMMARY"
  workspace-authority:
    name: 🏢 Workspace Authority Gate (CHECK 3.58)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.0
          run_install: false

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Πάκετα (jest για τις άγκυρες)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Layer 2 — ΑΝΕΥ ΟΡΩΝ και ΠΛΗΡΕΣ. Ένας νέος αναγνώστης καναλιού
      # προσγειώνεται σε ΟΠΟΙΟΔΗΠΟΤΕ αρχείο, και μια αλλαγή στο μητρώο
      # ξανα-ταξινομεί αρχεία ΠΟΥ ΚΑΝΕΙΣ ΔΕΝ ΕΣΤΕΙΛΕ — μερική ανάλυση θα ήταν αναληθής.
      - name: 🏢 CHECK 3.58 — κανένα κανάλι ενεργού χώρου χωρίς κριτή
        run: pnpm run workspace-authority:check

      - name: "🧪 Σουίτα μετάλλαξης — CHECK 3.58"
        run: pnpm run test:workspace-authority

      - name: 🧭 How to resolve
        if: failure()
        run: |
          {
            echo "### CHECK 3.58 — ADR-787 §5.2 (η αρχή του ενεργού χώρου)"
            echo "Η ερώτηση «επιτρέπεσαι σε αυτόν τον χώρο;» έχει **ΕΝΑ** σπίτι:"
            echo '`src/lib/auth/workspace-membership.ts`.'
            echo ""
            echo "**κανάλι χωρίς κριτή** (zero-tolerance) → κάλεσε τον απαντητή ΣΤΟ ΙΔΙΟ ΑΡΧΕΙΟ:"
            echo '`decideMembership({ uid, claimCompanyId, globalRole, requested: orgWorkspace(id) })`'
            echo "⛔ ΜΗΝ τον βάλεις στον καλούντα — θα ήταν κανόνας που ο επόμενος πρέπει να θυμάται."
            echo ""
            echo "**νέος αναγνώστης καναλιού** → μπλοκάρει ΑΚΟΜΑ ΚΙ ΑΝ καλεί σωστά τον κριτή."
            echo "Αυτό ΕΙΝΑΙ το σημείο: δεύτερος σωστός αναγνώστης είναι αρχιτεκτονικό γεγονός."
            echo "Δήλωσέ τον στο \`.workspace-authority.json\` → \`readers[]\`, ΜΕ ΛΟΓΟ."
            echo ""
            echo "Απογραφή: \`npm run workspace-authority:report\`"
            echo "Reseed ΜΟΝΟ μετά από νόμιμο καθάρισμα: \`npm run workspace-authority:baseline\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════════
  # CHECK 3.60 — Η ΕΜΒΕΛΕΙΑ ΤΟΥ ΧΩΡΟΥ (ADR-787 §5.3 γ)
  # ⚠️ ΕΔΩ ΚΑΙ ΟΧΙ ΣΕ ΝΕΟ WORKFLOW: το μητρώο του CHECK 3.37 παρακολουθεί ΑΡΧΕΙΑ
  #    workflow, όχι jobs ⇒ το πλήθος πυλών μένει ΑΜΕΤΑΒΛΗΤΟ.
  # ═══════════════════════════════════════════════════════════════════════════
  workspace-scope:
    name: 🗺️ Workspace Scope Gate (CHECK 3.60)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.0
          run_install: false

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Πάκετα (jest για τις άγκυρες)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Layer 2 — ΑΝΕΥ ΟΡΩΝ και ΠΛΗΡΕΣ. Μια αλλαγή στο πρόθεμα ή στο κλειστό σύνολο
      # ξανα-ταξινομεί ΚΑΘΕ σελίδα του (app) — αρχεία που κανείς δεν έστειλε.
      # ⚡ Κοστίζει 41ms: το πλήρες είναι φθηνότερο από κάθε σκανδάλη.
      - name: 🗺️ CHECK 3.60 — καμία σελίδα εκτός χώρου χωρίς δηλωμένο λόγο
        run: pnpm run workspace-scope:check

      - name: "🧪 Σουίτα μετάλλαξης — CHECK 3.60 (21 άγκυρες, μεταλλάξεις στις ΕΙΣΟΔΟΥΣ)"
        run: pnpm run test:workspace-scope

      - name: 🧭 How to resolve
        if: failure()
        run: |
          {
            echo "### CHECK 3.60 — ADR-787 §5.3 γ (η εμβέλεια του χώρου)"
            echo "**Η ΠΡΟΕΠΙΛΟΓΗ ΕΙΝΑΙ «ΜΠΑΙΝΕΙ»**: κάθε σελίδα του (app) ζει πίσω από"
            echo "το πρόθεμα χώρου, εκτός αν δηλωθεί ρητά εξαίρεση **με λόγο**."
            echo ""
            echo "**ορφανή δήλωση** (zero-tolerance) → εξαίρεση για φάκελο που δεν υπάρχει."
            echo "Σβήσε τη γραμμή από .workspace-scope.json. Κάθε νεκρή γραμμή είναι"
            echo "ένα όνομα που ο χρήστης δεν μπορεί να πάρει ΧΩΡΙΣ ΛΟΓΟ."
            echo ""
            echo "**νέα εξαίρεση** → μπλοκάρει ΑΚΟΜΑ ΚΙ ΑΝ είναι σωστή: βγάζει σελίδα ΕΞΩ"
            echo "από τον χώρο, δηλαδή την κάνει κοινή για όλους — απόφαση ασφαλείας."
            echo ""
            echo "**σελίδα χωρίς πρόθεμα** (ratchet) → ο αριθμός ΜΟΝΟ μειώνεται."
            echo "⚠️ ΔΕΝ είναι δείκτης υγείας: είναι το μέτρο μιας εκστρατείας που"
            echo "τελειώνει στο μηδέν (ADR-787 §5.3, Βήμα 3)."
            echo ""
            echo "Απογραφή: npm run workspace-scope:report"
            echo "⛔ ΜΗΝ κάνεις μαζικό reseed: πρώτα ο ισομορφισμός (§5.3 στ)."
          } >> "$GITHUB_STEP_SUMMARY"

  navigation-boundary:
    name: 🧭 Navigation Boundary Gate (CHECK 3.61)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.0
          run_install: false

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Πάκετα (jest + ts-morph για τις άγκυρες)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Layer 2 — ΑΝΕΥ ΟΡΩΝ και ΠΛΗΡΕΣ. Το pre-commit έχει σκανδάλη· εδώ όχι, γιατί
      # μια αλλαγή στο κλειστό σύνολο ιδιοκτητών ξανα-ταξινομεί αρχεία που ΚΑΝΕΙΣ
      # δεν έστειλε — και επειδή το `SKIP_NAVIGATION_BOUNDARY` δεν φτάνει ως εδώ.
      - name: 🧭 CHECK 3.61 — κάθε σημείο πλοήγησης ζητά το σύνορο
        run: pnpm run navigation-boundary:check

      - name: "🧪 Σουίτα μετάλλαξης — CHECK 3.61 (25 άγκυρες, 10/10 μεταλλάξεις κόκκινες)"
        run: pnpm run test:navigation-boundary

      - name: 🧭 How to resolve
        if: failure()
        run: |
          {
            echo "### CHECK 3.61 — ADR-787 §5.3 ν (το σύνορο της πλοήγησης)"
            echo "**Η ΠΡΟΕΠΙΛΟΓΗ ΕΙΝΑΙ «ΠΕΡΝΑΣ ΑΠΟ ΤΟ ΣΥΝΟΡΟ»** — μία γραμμή ανά αρχείο,"
            echo "αλλάζει ΜΟΝΟ η πηγή της εισαγωγής, τα σημεία κλήσης μένουν αυτούσια."
            echo ""
            echo '  ❌ import Link from "next/link";'
            echo '  ❌ import { useRouter } from "next/navigation";'
            echo '  ✅ import { Link, useRouter } from "@/lib/workspace/navigation";'
            echo ""
            echo "Μαζικά: node scripts/migrate-navigation-boundary.mjs --apply"
            echo ""
            echo "**boundary-bypass** (zero-tol) → ωμό \`Link\`/\`useRouter\`/\`usePathname\`."
            echo "Ένα ωμό \`prefetch\` προφορτώνει 404 **χωρίς κανένα ίχνος**: η πλοήγηση"
            echo "απλώς «είναι αργή». Γι' αυτό ΔΕΝ υπάρχει baseline — ΜΙΑ αρκεί."
            echo ""
            echo "**orphan-owner** → δήλωση που δείχνει σε αρχείο που δεν αγγίζει πια"
            echo "ωμό Next. Σβήσε τη γραμμή: κάθε νεκρή δήλωση είναι πόρτα που μένει"
            echo "ανοιχτή χωρίς να τη θέλει κανείς."
            echo ""
            echo "**reasonless-owner** → ο λόγος είναι ΥΠΟΧΡΕΩΤΙΚΟΣ (≥40 χαρακτήρες)."
            echo "Δήλωση χωρίς λόγο είναι παράκαμψη με άλλο όνομα."
            echo ""
            echo "Απογραφή: npm run navigation-boundary:report"
            echo "⛔ ΜΗΝ λύσεις κόκκινο δηλώνοντας νέο ιδιοκτήτη «για να περάσει»:"
            echo "το κλειστό σύνολο υπάρχει για να το δει άνθρωπος."
          } >> "$GITHUB_STEP_SUMMARY"

  shell-surface:
    name: 🏛️ Shell Surface Gate (CHECK 3.63)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # οι άγκυρες Π κάνουν `git show` σε ΚΑΡΦΩΜΕΝΟ commit

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.0
          run_install: false

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Πάκετα (jest για τις άγκυρες)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Layer 2 — ΑΝΕΥ ΟΡΩΝ. Το pre-commit δεν έχει σκανδάλη (το πλήρες κοστίζει
      # ~0,3s), αλλά το `SKIP_SHELL_SURFACE` δεν φτάνει ως εδώ — και μια αλλαγή
      # στον ΙΔΙΟΚΤΗΤΗ ξανα-ταξινομεί κάθε σελίδα, ακόμα κι αυτές που κανείς
      # δεν έστειλε.
      - name: 🏛️ CHECK 3.63 — ο διάδρομος έχει έναν ιδιοκτήτη
        run: pnpm run shell-surface:check

      - name: "🧪 Άγκυρες — CHECK 3.63 (22 άγκυρες, 7/7 μεταλλάξεις κόκκινες)"
        run: pnpm run test:shell-surface

      - name: 🧭 How to resolve
        if: failure()
        run: |
          {
            echo "### CHECK 3.63 — ADR-797 (ο διάδρομος του κελύφους)"
            echo "**ΤΟ ΕΞΩΤΕΡΙΚΟ ΚΕΝΟ ΑΝΗΚΕΙ ΣΤΟ ΚΕΛΥΦΟΣ, ΟΧΙ ΣΤΗ ΣΕΛΙΔΑ.**"
            echo "Ο κανόνας είναι ομόφωνος στα design systems: *outer spacing is a"
            echo "**layout** concern, not a component one*."
            echo ""
            echo '  ❌ <section className="flex flex-col gap-6 p-6">'
            echo '  ✅ <section className="flex flex-col gap-6">'
            echo ""
            echo "**page-padding / content-padding** → σβήσε το \`p-*\`/\`px-*\` από τη"
            echo "**ρίζα**. Το κενό ΜΕΣΑ σε κάρτα/διάλογο/ταμπλό είναι σωστό και δεν"
            echo "κρίνεται — παραβίαση είναι μόνο το κενό ΓΥΡΩ από τη σελίδα."
            echo ""
            echo "**negative-margin** → σιωπηλό opt-out. Αν θέλεις πλήρες πλάτος,"
            echo "δήλωσέ το: \`<FullBleedSurface>\` + γραμμή στο .shell-surface.json."
            echo ""
            echo "**owner-declares-padding / owner-lost-marker** (⛔ zero-tol) → κάποιος"
            echo "άγγιξε τον ΙΔΙΟ τον ιδιοκτήτη (MainContentBridge). Χωρίς τον δείκτη"
            echo "\`data-shell-surface\` ο διάδρομος γίνεται **σιωπηλά μηδέν**."
            echo ""
            echo "**undeclared-bleed** (⛔) → νέα επιφάνεια χωρίς διάδρομο ΜΠΛΟΚΑΡΕΙ"
            echo "ακόμα κι αν είναι σωστή. Αυτό είναι το σημείο: το opt-out πρέπει να"
            echo "το δει άνθρωπος, αλλιώς η δεύτερη σωστή πράξη γίνεται τρίτη."
            echo "Ο λόγος οφείλει να είναι **ΜΕΤΡΗΜΕΝΟΣ** — δες \$howToMeasure."
            echo ""
            echo "**orphan-declaration** (⛔) → δήλωση για διαδρομή που δεν τη ζητά πια."
            echo ""
            echo "Απογραφή: npm run shell-surface:report"
            echo "⛔ ΜΗΝ αλλάξεις τους ΠΟΛΟΥΣ (design-tokens.json → spacing.layout) για"
            echo "να «φαίνεται καλύτερα» μία σελίδα: αφορούν ΟΛΗ την εφαρμογή."
          } >> "$GITHUB_STEP_SUMMARY"
