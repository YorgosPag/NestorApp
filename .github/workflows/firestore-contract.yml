name: T2 🔬 Firestore Verified Fake (ADR-742)

# ─────────────────────────────────────────────────────────────────────────────
# VERIFIED FAKE — η ΙΔΙΑ σουίτα συμβολαίου τρέχει στο `FakeFirestore` (jest-suite) ΚΑΙ εδώ, στον ΠΡΑΓΜΑΤΙΚΟ Firestore
# emulator με το Admin SDK. Αν ένας ισχυρισμός περνά στο fake και κοκκινίζει εδώ, το fake λέει ψέματα — και κάθε
# test πάνω του (≈140 αρχεία) κρίνει κώδικα που η παραγωγή δεν εκτελεί.
#
# Μετρημένο 2026-09-30 (ADR-742 §7sexdecies): στην πρώτη εκτέλεση ο emulator βρήκε ΔΥΟ ψέματα που κανένα από τα τρία
# παλιά fakes δεν μπορούσε να δει — το `set({merge:true})` συγχωνεύει ΒΑΘΙΑ (το fake ρηχά, με σχόλιο που το
# υπερασπιζόταν) και χωρίς `orderBy` η σειρά είναι κατά id (τα fakes: σειρά εισαγωγής).
#
# Τρέχει μόνο όταν αλλάζει το fake, το συμβόλαιο ή η εργαλειοθήκη του emulator — όχι σε κάθε PR.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    paths:
      - 'src/test-utils/fake-firestore/**'
      - 'tests/firestore-contract/**'
      - 'tests/functions-integration/_harness/emulator.ts'
      - 'jest.config.firestore-contract.js'
      - '.github/workflows/firestore-contract.yml'
      - '.github/actions/setup-firebase-emulators/**' # ADR-800: η εργαλειοθήκη του emulator
      - 'scripts/lib/firestore-deploy/model.js' # ADR-800: FIREBASE_TOOLS_VERSION
      - 'firebase.json'
  push:
    branches: [main]
    paths:
      - 'src/test-utils/fake-firestore/**'
      - 'tests/firestore-contract/**'
      - 'tests/functions-integration/_harness/emulator.ts'
      - 'jest.config.firestore-contract.js'
      - '.github/workflows/firestore-contract.yml'
      - '.github/actions/setup-firebase-emulators/**'
      - 'scripts/lib/firestore-deploy/model.js'

concurrency:
  group: firestore-contract-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: 🧪 Firestore contract on the emulator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.14.0
          run_install: false

      - name: 📦 Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📥 Install root dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🧰 Firebase emulator toolchain (μία έκδοση)
        uses: ./.github/actions/setup-firebase-emulators

      # `pnpm exec jest` μέσα στο emulators:exec: το υποκέλυφος κληρονομεί το PATH του γονέα, και ωμό `jest` εκεί δεν
      # λύνεται (μετρημένο στο functions-integration.yml: `/bin/sh: 1: jest: not found`, exit 127).
      - name: 🧪 Run the contract against the emulator
        run: firebase emulators:exec --only firestore --project demo-nestor-firestore-contract "pnpm exec jest --config jest.config.firestore-contract.js --ci"
        env:
          CI: 'true'

      - name: ✅ Summary
        if: success()
        run: |
          echo "::notice title=Firestore Verified Fake::The fake and the emulator agree on every contract assertion"
