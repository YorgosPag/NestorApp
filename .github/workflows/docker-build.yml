name: T1 🚀 Build & Deploy Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: yorgospag/nestor-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Add extra swap — GitHub runner already has /swapfile, use /swapfile2
      - name: Configure swap
        run: |
          sudo fallocate -l 6G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ⚠️ `build:ci`, NOT `build`: the `build` script hardcodes
      # `cross-env NODE_OPTIONS=--max-old-space-size=8192`, which OVERWRITES the
      # NODE_OPTIONS below — the 12288 was silently discarded and the build ran
      # at 8192. That ceiling was crossed on 2026-08-04 (OOM at 7847 MB) and the
      # production deploy to Netcup stopped shipping. `build:ci` omits cross-env
      # so the env below actually reaches the process.
      # Any workflow calling build:ci MUST set NODE_OPTIONS itself.
      - name: Build Next.js app
        run: pnpm run build:ci
        env:
          NODE_OPTIONS: '--max-old-space-size=12288'
          NODE_ENV: production
          DISABLE_SENTRY_WEBPACK: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          # Firebase public config (browser-exposed, not secret)
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAcqK3o-zPmXodFPr-gG328QJHlcEc6g1k
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:157616068729:web:c7dc1ed6661c895ee19ca8'
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: pagonis-87766.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '157616068729'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: pagonis-87766
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: pagonis-87766.firebasestorage.app
          NEXT_PUBLIC_SENTRY_DSN: https://ceba8fb4650f8d54df1b489f6360e109@o4511056899014656.ingest.de.sentry.io/4511056927981648
          NEXT_PUBLIC_ADMIN_EMAIL: errors@inbound.nestorconstruct.gr
          NEXT_PUBLIC_ADMIN_EMAILS: 'pagonis.oe@gmail.com,georgios.pagonis@gmail.com'
          NEXT_PUBLIC_DEFAULT_COMPANY_ID: comp_9c7c1a50-f370-466d-bdf7-aa7b2b2d7757
          NEXT_PUBLIC_DEBUG: 'false'
          NEXT_PUBLIC_DXF_AI_ASSISTANT: 'false'
          NEXT_PUBLIC_COMPANY_NAME: Pagonis Energo
          NEXT_PUBLIC_COMPANY_EMAIL: georgios.pagonis@gmail.com
          NEXT_PUBLIC_COMPANY_PHONE: '6974050023'
          NEXT_PUBLIC_COMPANY_WEBSITE: https://nestorconstruct.gr
          # 🔴 ADR-848 §10 — Η ΔΙΕΥΘΥΝΣΗ ΜΑΣ, ΤΗ ΣΤΙΓΜΗ ΤΟΥ BUILD. Το Next «ψήνει» ΜΟΝΟ
          # όσες `NEXT_PUBLIC_*` υπάρχουν εδώ (`next/dist/lib/static-env.js`: value != null).
          # Χωρίς αυτή τη γραμμή ο SERVER τη διάβαζε από το Coolify στο runtime (σωστά),
          # αλλά ο BROWSER δεν τη μάθαινε ποτέ ⇒ το QR της πινακίδας σχεδίων τύπωνε
          # `nestor-app.vercel.app` (νεκρό, Vercel παγωμένο από 2026-05-09).
          NEXT_PUBLIC_APP_URL: https://nestorconstruct.gr
          # 🔴 ADR-860 §Ε0 — Η ΤΑΥΤΟΤΗΤΑ ΤΗΣ ΕΚΔΟΣΗΣ. Ο browser τη συγκρίνει με το `/api/build-info`
          # όταν αποτύχει φόρτωση chunk: ίδια ⇒ δίκτυο (επανάληψη), διαφορετική ⇒ deploy (ανανέωση).
          # ⚠️ ΟΧΙ το `deploymentId` του Next: εκείνο βάζει `?dpl=` σε ΚΑΘΕ asset και θα ακύρωνε
          # την cache του browser σε κάθε deploy. ⚠️ Ίδια γραμμή στο `bundle-ratchet.yml` (CHECK 3.57).
          NEXT_PUBLIC_DEPLOYMENT_ID: ${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🔴 ADR-860 §Ε1 — ΤΑ ASSETS ΤΗΣ ΠΡΟΗΓΟΥΜΕΝΗΣ ΕΚΔΟΣΗΣ ΜΕΝΟΥΝ ΣΤΗ ΝΕΑ ΕΙΚΟΝΑ (7 ημέρες).
      # Χωρίς αυτό κάθε deploy έσβηνε τον κώδικα της προηγούμενης έκδοσης ⇒ κάθε ανοιχτή καρτέλα
      # που ζητούσε chunk μετά το deploy έπεφτε σε οθόνη σφάλματος (ADR-858 §5.5 · ADR-860).
      # 🔑 ΔΕΝ ΞΑΝΑΧΤΙΖΕΙ (CHECK 3.57 / ADR-788): τα παλιά έρχονται από την ήδη δημοσιευμένη εικόνα.
      # 🔑 ΠΟΤΕ ΔΕΝ ΣΤΑΜΑΤΑ ΤΟ DEPLOY: αποτυχία pull ή script ⇒ `::warning::`, το build συνεχίζει.
      - name: Carry forward previous static assets
        env:
          PREVIOUS_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        run: |
          PREV_ARG=""
          if docker pull "$PREVIOUS_IMAGE"; then
            CID=$(docker create "$PREVIOUS_IMAGE")
            mkdir -p .prev-static
            if docker cp "$CID:/app/.next/static/." .prev-static/; then PREV_ARG="--prev .prev-static"; fi
            docker rm "$CID" > /dev/null
          fi
          if [ -z "$PREV_ARG" ]; then
            echo "::warning::ADR-860 §Ε1 — previous image unavailable; no assets carried forward"
          fi
          node scripts/deploy/carry-forward-static-assets.js $PREV_ARG --next .next/static --deployment "${{ github.sha }}" \
            || echo "::warning::ADR-860 §Ε1 — carry-forward failed; deploying without retained assets"

      # Resilient buildx setup — routes Docker Hub traffic through mirror.gcr.io
      # with retry/backoff. SSOT: .github/actions/setup-buildx-resilient.
      # Fixes transient "registry-1.docker.io ... Client.Timeout" deploy failures.
      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-resilient

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No cache: standalone output must be fresh every build
          no-cache: true

      - name: Trigger Coolify redeploy
        if: success()
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          echo "Triggering Coolify redeploy..."
          RESPONSE=$(curl -s -X GET \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "http://159.195.44.221:8000/api/v1/applications/f661kuiq901llma0o8unhvpi/start")
          echo "Coolify response: ${RESPONSE}"

      - name: Telegram notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            ICON="✅"
            LABEL="Deploy completato"
          else
            ICON="❌"
            LABEL="Deploy FALLITO"
          fi
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)
          TEXT="${ICON} *NestorApp — ${LABEL}*%0A%0A📝 ${COMMIT_MSG}%0A🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&text=${TEXT}&parse_mode=Markdown"
