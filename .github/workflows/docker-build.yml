name: T1 🚀 Build & Deploy Docker Image

# =============================================================================
# ADR-865 §11 — Η ΓΡΑΜΜΗ ΠΑΡΑΓΩΓΗΣ: ο κώδικας ΔΕΝ κυκλοφορεί πριν τους κανόνες/δείκτες του.
#
#   build-and-push ───────────────────────────────────────────────────┐
#   firebase-plan (ρωτά τον ΠΑΡΟΧΟ, μόνο ανάγνωση) ─► firebase-succession ├─► release (:latest → Coolify)
#        └─ apply ─► firebase-apply (⏸ ΕΓΚΡΙΣΗ) ◄── firebase-queue-watch ┘        └─► notify (Telegram)
#
# ADR-865 §11.9 — ΔΙΑΔΟΧΗ: ισχύει ΜΟΝΟ η κορυφή του main (GitOps). Ένα παλαιότερο τρέξιμο που
# περιμένει έγκριση ΑΚΥΡΩΝΕΤΑΙ από το νεότερο (κρατούσε την ουρά firebase-production και το νεότερο
# έμενε χωρίς κουμπί — μετρημένο 2026-09-19)· ένα τρέξιμο που ΔΕΝ είναι πια κορυφή αυτοακυρώνεται
# πριν αναπτύξει ή κυκλοφορήσει. ΠΟΤΕ cancel-in-progress: true — ανάπτυξη που ΤΡΕΧΕΙ δεν κόβεται.
#
# Πριν: η εικόνα έφευγε στο Netcup, οι κανόνες/δείκτες ΠΟΤΕ (το push δεν πάει στο Firebase) ⇒
# δύο φορές σε μία εβδομάδα «Missing or insufficient permissions» με σωστό κώδικα (16/09, 18/09).
# Τώρα: GitOps — το δέντρο λέει «τι θέλουμε», ο πάροχος ρωτιέται ΣΕ ΚΑΘΕ push, και η έγκριση
# ζητείται ΜΟΝΟ όταν η παραγωγή διαφέρει (Argo CD: sync only if OutOfSync). Δείκτες εκτός
# αρχείου δεν σβήνονται ποτέ από εδώ (Argo CD prune off by default · firebase-tools χωρίς --force).
#
# ⚠️ Τα ονόματα των jobs firebase-plan / firebase-apply / release και το environment
#    firebase-production είναι SSoT στο scripts/lib/firestore-deploy/model.js (PIPELINE) — τα
#    ρωτά η άγκυρα firestore-deploy-pipeline.test.js. Αφαίρεση της φύλαξης = κόκκινο test.
# =============================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      firebase_dry_run:
        description: 'ADR-865 §11 — δοκιμή του deployer: firebase deploy --dry-run (ΚΑΜΙΑ εγγραφή, ΚΑΜΙΑ κυκλοφορία)'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: yorgospag/nestor-app
  FIREBASE_PROJECT_ID: pagonis-87766

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Add extra swap — GitHub runner already has /swapfile, use /swapfile2
      - name: Configure swap
        run: |
          sudo fallocate -l 6G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ⚠️ `build:ci`, NOT `build`: the `build` script hardcodes
      # `cross-env NODE_OPTIONS=--max-old-space-size=8192`, which OVERWRITES the
      # NODE_OPTIONS below — the 12288 was silently discarded and the build ran
      # at 8192. That ceiling was crossed on 2026-08-04 (OOM at 7847 MB) and the
      # production deploy to Netcup stopped shipping. `build:ci` omits cross-env
      # so the env below actually reaches the process.
      # Any workflow calling build:ci MUST set NODE_OPTIONS itself.
      - name: Build Next.js app
        run: pnpm run build:ci
        env:
          NODE_OPTIONS: '--max-old-space-size=12288'
          NODE_ENV: production
          DISABLE_SENTRY_WEBPACK: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          # Firebase public config (browser-exposed, not secret)
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAcqK3o-zPmXodFPr-gG328QJHlcEc6g1k
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:157616068729:web:c7dc1ed6661c895ee19ca8'
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: pagonis-87766.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '157616068729'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: pagonis-87766
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: pagonis-87766.firebasestorage.app
          NEXT_PUBLIC_SENTRY_DSN: https://ceba8fb4650f8d54df1b489f6360e109@o4511056899014656.ingest.de.sentry.io/4511056927981648
          NEXT_PUBLIC_ADMIN_EMAIL: errors@inbound.nestorconstruct.gr
          NEXT_PUBLIC_ADMIN_EMAILS: 'pagonis.oe@gmail.com,georgios.pagonis@gmail.com'
          NEXT_PUBLIC_DEFAULT_COMPANY_ID: comp_9c7c1a50-f370-466d-bdf7-aa7b2b2d7757
          NEXT_PUBLIC_DEBUG: 'false'
          NEXT_PUBLIC_DXF_AI_ASSISTANT: 'false'
          NEXT_PUBLIC_COMPANY_NAME: Pagonis Energo
          NEXT_PUBLIC_COMPANY_EMAIL: georgios.pagonis@gmail.com
          NEXT_PUBLIC_COMPANY_PHONE: '6974050023'
          NEXT_PUBLIC_COMPANY_WEBSITE: https://nestorconstruct.gr
          # 🔴 ADR-848 §10 — Η ΔΙΕΥΘΥΝΣΗ ΜΑΣ, ΤΗ ΣΤΙΓΜΗ ΤΟΥ BUILD. Το Next «ψήνει» ΜΟΝΟ
          # όσες `NEXT_PUBLIC_*` υπάρχουν εδώ (`next/dist/lib/static-env.js`: value != null).
          # Χωρίς αυτή τη γραμμή ο SERVER τη διάβαζε από το Coolify στο runtime (σωστά),
          # αλλά ο BROWSER δεν τη μάθαινε ποτέ ⇒ το QR της πινακίδας σχεδίων τύπωνε
          # `nestor-app.vercel.app` (νεκρό, Vercel παγωμένο από 2026-05-09).
          NEXT_PUBLIC_APP_URL: https://nestorconstruct.gr
          # 🔴 ADR-860 §Ε0 — Η ΤΑΥΤΟΤΗΤΑ ΤΗΣ ΕΚΔΟΣΗΣ. Ο browser τη συγκρίνει με το `/api/build-info`
          # όταν αποτύχει φόρτωση chunk: ίδια ⇒ δίκτυο (επανάληψη), διαφορετική ⇒ deploy (ανανέωση).
          # ⚠️ ΟΧΙ το `deploymentId` του Next: εκείνο βάζει `?dpl=` σε ΚΑΘΕ asset και θα ακύρωνε
          # την cache του browser σε κάθε deploy. ⚠️ Ίδια γραμμή στο `bundle-ratchet.yml` (CHECK 3.57).
          NEXT_PUBLIC_DEPLOYMENT_ID: ${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🔴 ADR-860 §Ε1 — ΤΑ ASSETS ΤΗΣ ΠΡΟΗΓΟΥΜΕΝΗΣ ΕΚΔΟΣΗΣ ΜΕΝΟΥΝ ΣΤΗ ΝΕΑ ΕΙΚΟΝΑ (7 ημέρες).
      # Χωρίς αυτό κάθε deploy έσβηνε τον κώδικα της προηγούμενης έκδοσης ⇒ κάθε ανοιχτή καρτέλα
      # που ζητούσε chunk μετά το deploy έπεφτε σε οθόνη σφάλματος (ADR-858 §5.5 · ADR-860).
      # 🔑 ΔΕΝ ΞΑΝΑΧΤΙΖΕΙ (CHECK 3.57 / ADR-788): τα παλιά έρχονται από την ήδη δημοσιευμένη εικόνα.
      # 🔑 ΠΟΤΕ ΔΕΝ ΣΤΑΜΑΤΑ ΤΟ DEPLOY: αποτυχία pull ή script ⇒ `::warning::`, το build συνεχίζει.
      - name: Carry forward previous static assets
        env:
          PREVIOUS_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        run: |
          PREV_ARG=""
          if docker pull "$PREVIOUS_IMAGE"; then
            CID=$(docker create "$PREVIOUS_IMAGE")
            mkdir -p .prev-static
            if docker cp "$CID:/app/.next/static/." .prev-static/; then PREV_ARG="--prev .prev-static"; fi
            docker rm "$CID" > /dev/null
          fi
          if [ -z "$PREV_ARG" ]; then
            echo "::warning::ADR-860 §Ε1 — previous image unavailable; no assets carried forward"
          fi
          node scripts/deploy/carry-forward-static-assets.js $PREV_ARG --next .next/static --deployment "${{ github.sha }}" \
            || echo "::warning::ADR-860 §Ε1 — carry-forward failed; deploying without retained assets"

      # Resilient buildx setup — routes Docker Hub traffic through mirror.gcr.io
      # with retry/backoff. SSOT: .github/actions/setup-buildx-resilient.
      # Fixes transient "registry-1.docker.io ... Client.Timeout" deploy failures.
      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-resilient

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # ADR-865 §11 — ΜΟΝΟ η αμετάβλητη ετικέτα του commit. Το `:latest` = «ό,τι ΚΥΚΛΟΦΟΡΗΣΕ»
          # και το δίνει ΜΟΝΟ το job `release`, αφού οι κανόνες/δείκτες είναι ζωντανοί. Έτσι και
          # το carry-forward (ADR-860 §Ε1) διαβάζει την προηγούμενη ΚΥΚΛΟΦΟΡΗΜΕΝΗ έκδοση.
          tags: |
            type=sha,prefix=main-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No cache: standalone output must be fresh every build
          no-cache: true

  # ───────────────────────────────────────────────────────────────────────────
  # ADR-865 §11 — ΠΛΑΝΟ: ρωτά την ΠΑΡΑΓΩΓΗ (όχι «ποια αρχεία άλλαξαν»). Τρέχει ΠΑΡΑΛΛΗΛΑ με το
  # build, οπότε η έγκριση μπορεί να δοθεί όσο χτίζεται η εικόνα — κόστος χρόνου ~0.
  # Ταυτότητα: «drift reader» (6 δικαιώματα, ΚΑΜΙΑ ανάγνωση δεδομένων πελατών).
  # Έξοδος 1 (⇒ καμία κυκλοφορία) ΜΟΝΟ όταν ο πάροχος δεν απάντησε ή δείκτης χτίζεται ακόμη.
  # ───────────────────────────────────────────────────────────────────────────
  firebase-plan:
    name: 🧭 Firebase — πλάνο (μόνο ανάγνωση)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      deployments: read # ADR-865 §11.10: ποιο GitHub Deployment ανέπτυξε ό,τι τρέχει
    outputs:
      action: ${{ steps.plan.outputs.action }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # προέλευση του ζωντανού από το ιστορικό (world.attributeFromHistory)

      - uses: ./.github/actions/firebase-identity
        with:
          service-account: ${{ vars.GCP_SA_VERIFY }}
          workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}

      - name: 🔎 Ζωντανό έναντι δέντρου → πλάνο
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }} # ADR-865 §11.10: ποιο GitHub Deployment ανέπτυξε ό,τι τρέχει
        run: node scripts/firestore-deploy/verify-live.js --plan --wait --timeout 1800

  # ───────────────────────────────────────────────────────────────────────────
  # ADR-865 §11.9 — ΔΙΑΔΟΧΗ. Τρέχει ΜΕΤΑ το πλάνο (όσο πιο κοντά γίνεται στο αίτημα έγκρισης):
  #   · όχι κορυφή του main ⇒ το τρέξιμο αυτοακυρώνεται (γκρι, όχι κόκκινο — ο CI Health μετρά
  #     ως «έσπασε» μόνο το failure) και ΔΕΝ ζητά ποτέ έγκριση για παλαιότερο δέντρο·
  #   · κορυφή ⇒ ακυρώνει κάθε παλαιότερο τρέξιμο που ΠΕΡΙΜΕΝΕΙ έγκριση (pending_deployments),
  #     ποτέ ένα που ήδη αναπτύσσει. Έτσι η κορυφή παίρνει ΠΑΝΤΑ δικό της κουμπί έγκρισης.
  # Γιατί ακύρωση και όχι «Reject»: το POST …/pending_deployments το καλούν μόνο «Required
  # reviewers» (docs GitHub) — ο bot δεν είναι, και σωστά.
  # ───────────────────────────────────────────────────────────────────────────
  firebase-succession:
    name: 🧭 Firebase — διαδοχή (μόνο η κορυφή)
    needs: firebase-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # docs: «actions: write permits an action to cancel a workflow run»
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts

      - name: 🧭 Είμαι η κορυφή; — αντικατάσταση εκκρεμούς έγκρισης
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/firestore-deploy/succession.js claim

      # Ο ΕΝΑΣ αποστολέας (scripts/lib/ci/telegram.js). Η ίδια η σελίδα του τρεξίματος έχει το
      # κουμπί «Review deployments»· το email του GitHub δεν αρκεί για κάτι που φράζει την παραγωγή.
      - name: ⏸ Ειδοποίηση — ζητείται έγκριση
        if: needs.firebase-plan.outputs.action == 'apply' && inputs.firebase_dry_run != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          TARGETS: ${{ needs.firebase-plan.outputs.targets }}
        run: >-
          node scripts/ci/telegram-notify.js --status info --title "NestorApp — ⏸ Firebase: ζητείται έγκριση"
          --line "στόχοι: $TARGETS" --line "Review deployments → Approve · ο κώδικας περιμένει την έγκριση"

  # ───────────────────────────────────────────────────────────────────────────
  # ADR-865 §11.9 — ΦΥΛΑΚΑΣ ΤΗΣ ΟΥΡΑΣ. Κλείνει τον αγώνα που μένει μετά το claim: ένα παλαιότερο
  # τρέξιμο που ήταν ακόμη κορυφή στο δικό του claim μπορεί να μπει σε αναμονή έγκρισης ΑΦΟΥ
  # σκούπισε η νεότερη κορυφή. Όσο το apply αυτού του τρεξίματος κάθεται στην ουρά ΧΩΡΙΣ κουμπί,
  # ξανασκουπίζει κάθε 30″· τελειώνει μόλις πάρει κουμπί, τρέξει ή τελειώσει.
  # ───────────────────────────────────────────────────────────────────────────
  firebase-queue-watch:
    name: 🛎️ Firebase — φύλακας ουράς έγκρισης
    needs: [firebase-plan, firebase-succession]
    if: needs.firebase-plan.outputs.action == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: write
    steps:
      # Το workflow χρειάζεται: το API `…/jobs` επιστρέφει το `name:` του job, και ο φύλακας το
      # διαβάζει από εδώ με τον ΕΝΑ αναγνώστη YAML — όχι από δεύτερο αντίγραφο.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            .github/workflows

      - name: 🛎️ Η κορυφή παίρνει κουμπί έγκρισης
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/firestore-deploy/succession.js watch

  # ───────────────────────────────────────────────────────────────────────────
  # ADR-865 §11 — ΑΝΑΠΤΥΞΗ, ΜΕ ΕΓΚΡΙΣΗ. Το environment ΔΕΝ είναι διακόσμηση: η ταυτότητα εγγραφής
  # είναι δεμένη (WIF) στο claim `environment=firebase-production` ⇒ ΔΕΝ εκδίδεται χωρίς την
  # έγκριση του Giorgio. Αναπτύσσονται ΜΟΝΟ οι στόχοι που διαφέρουν, και μετά ρωτιέται ξανά ο
  # πάροχος μέχρι οι δείκτες να είναι READY (record-deploy.js → verify --wait).
  # Το αρχείο της πράξης = το GitHub Deployment του environment (ποιος ενέκρινε, πότε, ποιο commit).
  # ───────────────────────────────────────────────────────────────────────────
  firebase-apply:
    name: 🚀 Firebase — ανάπτυξη (με έγκριση)
    needs: [firebase-plan, firebase-succession]
    if: needs.firebase-plan.outputs.action == 'apply' || inputs.firebase_dry_run == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: firebase-production
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      actions: write # §11.9: αυτοακύρωση όταν η έγκριση δόθηκε αφού ήρθε νεότερο push
      deployments: read # §11.10: η επαλήθευση μετά την ανάπτυξη αποδίδει στο ΔΙΚΟ της Deployment
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # §11.9 — ΠΡΙΝ από την ταυτότητα: ένα τρέξιμο που δεν είναι πια κορυφή δεν παίρνει ΚΑΝ το
      # κλειδί του deployer. Η έγκριση μπορεί να δόθηκε ώρες μετά από νεότερο push· το δέντρο του
      # είναι παλαιότερο ⇒ θα γύριζε πίσω κανόνες (GitLab: «outdated deployment job»).
      - name: 🧭 Ακόμη η κορυφή;
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/firestore-deploy/succession.js guard

      - uses: ./.github/actions/firebase-identity
        with:
          service-account: ${{ vars.GCP_SA_DEPLOY }}
          workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}

      - name: 🚀 firebase deploy → επαλήθευση μέχρι READY
        env:
          TARGETS: ${{ needs.firebase-plan.outputs.targets }}
          GITHUB_TOKEN: ${{ github.token }} # §11.10: απόδοση στο ΔΙΚΟ της GitHub Deployment
          DRY_RUN: ${{ inputs.firebase_dry_run == true && '--dry-run' || '' }}
        run: >-
          node scripts/firestore-deploy/record-deploy.js --pipeline
          --project "$FIREBASE_PROJECT_ID" --only "$TARGETS" --wait --timeout 3000 $DRY_RUN

  # ───────────────────────────────────────────────────────────────────────────
  # ΚΥΚΛΟΦΟΡΙΑ — μόνο όταν η εικόνα χτίστηκε ΚΑΙ η παραγωγή Firebase είναι έτοιμη γι' αυτήν.
  # Απόρριψη έγκρισης / πάροχος σιωπηλός / δείκτης όχι READY ⇒ ο κώδικας ΔΕΝ κυκλοφορεί (fail-closed).
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: 📦 Κυκλοφορία στο Netcup
    needs: [build-and-push, firebase-plan, firebase-succession, firebase-apply]
    if: >-
      always() && !cancelled() && inputs.firebase_dry_run != true
      && needs.build-and-push.result == 'success'
      && needs.firebase-plan.result == 'success'
      && needs.firebase-succession.result == 'success'
      && (needs.firebase-apply.result == 'success' || needs.firebase-apply.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # §11.9 — μία κυκλοφορία τη φορά: ο φρουρός παρακάτω κρίνει ΜΕΤΑ από κάθε προηγούμενη
    # προώθηση του :latest. Εκκρεμής παλαιότερη αντικαθίσταται από νεότερη (queue: single).
    # ⛔ ΠΟΤΕ cancel-in-progress: true — θα έκοβε προώθηση/Coolify στη μέση.
    concurrency:
      group: netcup-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      actions: write # §11.9: αυτοακύρωση όταν δεν είναι πια κορυφή
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts

      # §11.9 — ένα αργό build παλαιότερου commit δεν γυρίζει ΠΟΤΕ πίσω το :latest (και το Netcup)
      # πάνω από νεότερη κυκλοφορία. GitLab: «prevent older deployment jobs from running».
      - name: 🧭 Ακόμη η κορυφή;
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/firestore-deploy/succession.js guard

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Προώθηση χωρίς ξαναχτίσιμο: το `:latest` δείχνει πλέον στην εικόνα ΑΥΤΟΥ του commit.
      - name: Promote image to :latest
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: docker buildx imagetools create --tag "${REGISTRY}/${IMAGE_NAME}:latest" "$IMAGE"

      - name: Trigger Coolify redeploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          echo "Triggering Coolify redeploy..."
          RESPONSE=$(curl -s -X GET \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "http://159.195.44.221:8000/api/v1/applications/f661kuiq901llma0o8unhvpi/start")
          echo "Coolify response: ${RESPONSE}"

  notify:
    name: 📣 Ειδοποίηση
    needs: [build-and-push, firebase-plan, firebase-succession, firebase-apply, release]
    if: always() && !cancelled() && inputs.firebase_dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts

      # §11.9 — μιλά ΜΟΝΟ η κορυφή (ή όποιος κυκλοφόρησε). Ένα τρέξιμο που το αντικατέστησε νεότερο
      # push δεν στέλνει «Deploy FALLITO»: δεν απέτυχε τίποτα — θα μιλήσει η κορυφή.
      - name: 🧭 Είμαι η κορυφή;
        id: tip
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/firestore-deploy/succession.js tip

      # Ο ΕΝΑΣ αποστολέας (scripts/lib/ci/telegram.js). Το μήνυμα του commit ΜΟΝΟ ως μεταβλητή
      # περιβάλλοντος — ποτέ `${{ }}` μέσα στο script (script injection, GitHub hardening guide).
      - name: Telegram notification
        if: steps.tip.outputs.fresh != 'false' || needs.release.result == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          STATUS: ${{ needs.release.result == 'success' && 'success' || 'failure' }}
          TITLE: ${{ needs.release.result == 'success' && 'NestorApp — Deploy completato' || 'NestorApp — Deploy FALLITO' }}
          STAGES: >-
            build ${{ needs.build-and-push.result }} · firebase-plan ${{ needs.firebase-plan.result }}
            (${{ needs.firebase-plan.outputs.action || '—' }}) · διαδοχή ${{ needs.firebase-succession.result }}
            · firebase-apply ${{ needs.firebase-apply.result }}
            · release ${{ needs.release.result }}
        run: node scripts/ci/telegram-notify.js --status "$STATUS" --title "$TITLE" --line "$STAGES"
